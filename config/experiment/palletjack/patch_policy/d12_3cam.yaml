# @package _global_

# All three cameras, concatenated along the patch axis: 3 x 144 patches + 1 speed
# + 3 observation tokens (fork_above_300, relative_ego_pos, relative_dropoff_pos)
# = 436 tokens per frame, against 148 for the single-camera arm. Cameras cost
# sequence length, not parameters, and attention is quadratic in it - hence the
# smaller batch. Frames are aligned across cameras by timestamp in `rmind.data.d12`.
defaults:
  - /experiment/palletjack/patch_policy/d12
  - _self_

cameras: [cam_fork, cam_left_forward, cam_right_forward]
num_cameras: 3
image_remap:
  cam_fork: [data, cam_fork]
  cam_left_forward: [data, cam_left_forward]
  cam_right_forward: [data, cam_right_forward]

# half the batch, twice the steps for the same ~20 epochs (see d12.yaml)
lr_warmup_steps: 2000
lr_total_steps: 70000

datamodule:
  train:
    batch_size: 4
  val:
    batch_size: 4

