# @package _global_

# Real D12 recordings on the patch-policy trunk, three cameras.
#
#   uv run python -m rmind.scripts.prepare_d12 --job-dir /nasa/team-space/nikita/data/d12/{job-id}
#   just train experiment=palletjack/patch_policy/d12
#
# Cameras are concatenated along the patch axis, so three cameras cost sequence
# length (3 * 256 + 1 = 769 tokens per frame) rather than parameters. Frames are
# aligned across cameras by timestamp in `prepare_d12`, not by index - the
# cameras run on independent clocks and drop frames independently.
defaults:
  - /model: palletjack/patch_policy/policy
  - /datamodule: palletjack/d12
  - /trainer: default
  - /trainer/callbacks: palletjack_patch_policy
  - /paths: palletjack/default
  - /wandb: yaak/rmind
  - _self_

episode_length: 6

cameras: [cam_fork, cam_left_forward, cam_right_forward]
num_cameras: 3
image_remap:
  cam_fork: [data, cam_fork]
  cam_left_forward: [data, cam_left_forward]
  cam_right_forward: [data, cam_right_forward]

image_encoder_name: vit_small_patch16_dinov3.lvd1689m
image_resize: [256, 256] # 256 / patch 16 -> 16x16 = 256 patch tokens per camera
image_embedding_dim: 384
num_patches: 256

window: 6
attention_impl: sdpa

policy_embedding_dim: 512
num_layers: 8
num_heads: 8

speed_bins: 64

lr: 1e-4
lr_warmup_steps: 100
lr_total_steps: 1000

trainer:
  max_epochs: 20
  precision: "bf16-mixed"
  gradient_clip_val: 1.0
  log_every_n_steps: 10

# 3 cameras x 6 frames of 1080p decode per sample, and a 769-token frame block:
# the sequence is 3x the single-camera one and attention is quadratic in it, so
# the batch is small. Upstream hit OOM at cam=3 on the yaak batch sizes.
datamodule:
  train:
    batch_size: 2
  val:
    batch_size: 2

# D12 frames are 1920x1080 straight off the camera, NOT the 576x324 the card rig
# renders, so this resizes rather than reusing the cards' CenterCrop([320, 576])
# - that crop would take a small central patch of a 1080p frame. 1920x1080 is
# already 16:9, so a plain resize introduces no distortion.
image_transform:
  _target_: torch.nn.Sequential
  _args_:
    - _target_: torchvision.transforms.v2.Resize
      size: ${image_resize}
      antialias: true
    - _target_: torchvision.transforms.v2.ToDtype
      scale: true
      dtype:
        _target_: hydra.utils.get_object
        path: torch.float32
    - _target_: torchvision.transforms.v2.Normalize
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]

wandb:
  tags: [palletjack, patch_policy, d12, 3cam]
