# @package _global_

defaults:
  - /model: yaak/rmind_zero/W1
  - /datamodule: yaak/train
  - /trainer: default
  - /trainer/callbacks: pretrain_route  # no continuous/discrete embeddings in W1
  - /paths: yaak/default
  - /wandb: yaak/rmind
  - _self_

num_heads: 4
num_layers: 8
encoder_embedding_dim: 384
image_embedding_dim: 384

episode_length: 6
action_horizon: 1
episode_step: 10
episode_stride: 10
# POLICY look-ahead: the current step + a 6-step strictly-future action chunk (a_6..a_11)
policy_chunk_horizon: 7
# TRAJECTORY head: 10 future poses (3.3 s) from the last encoded step
trajectory_horizon: 10
# clip_horizon spans the longest look-ahead: episode_length=6 encoded steps + 10 future poses
# need samples up to index 15 -> clip_length 16 (the policy chunk only uses the first 12)
clip_horizon: 11
clip_length: "${eval:'${episode_length} + ${clip_horizon} - 1'}"
clip_period: "${eval:'${clip_length} * ${episode_step}'}i"

speed_bins: 512
gas_pedal_bins: 255
brake_pedal_bins: 165
steering_angle_bins: 961
