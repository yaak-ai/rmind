# @package _global_

defaults:
  - /model: yaak/trajectory_tokenizer/raw
  - /datamodule: yaak/trajectory_train
  - /trainer: default
  - /trainer/callbacks: action_tokenizer
  - /paths: yaak/default
  - /wandb: yaak/rmind
  - _self_

# matches patch_policy (dinov3.yaml): poses every episode_step=10 frames
# (~1/3 s at 30 fps), trajectory_horizon=5 future poses (~1.67 s)
trajectory_horizon: 5
trajectory_step: 10
trajectory_stride: 10
trajectory_clip: "${eval:'${trajectory_horizon} + 1'}"
trajectory_clip_period: "${eval:'${trajectory_step} * ${trajectory_clip}'}i"

# absolute | delta -- see TrajectoryTokenizer's docstring
trajectory_representation: absolute

trajectory_dim: "${eval:'3 * ${trajectory_horizon}'}"
trajectory_hidden_dim: 128
trajectory_latent_dim: 384

# YawRotateTrajectory (model raw.yaml); off here, see pretrain_yaw.yaml. The
# other values mirror patch_policy's r1a_yaw arm: fx and the 576 -> 512 crop
# margin ((576 - 512) / 2 px), and its 32-frame causal episode for the walk.
trajectory_yaw_probability: 0.0
trajectory_yaw_fx: 389.4
trajectory_yaw_margin_px: 32
trajectory_yaw_walk_frames: 32
trajectory_yaw_init_max_deg: 4.0
trajectory_yaw_step_std_deg: 0.5

codebook_size: 16
num_quantizers: 4

# ~1239 steps/epoch at batch 2048: 40 epochs ~= the 50k-step cosine schedule in
# model/yaak/trajectory_tokenizer/raw.yaml, so the LR actually anneals
trainer:
  max_epochs: 40
