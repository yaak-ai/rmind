# @package _global_

defaults:
  - /model: yaak/trajectory_tokenizer/raw
  - /datamodule: yaak/train
  - /trainer: default
  - /trainer/callbacks: action_tokenizer
  - /paths: yaak/default
  - /wandb: yaak/rmind
