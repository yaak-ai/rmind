# @package _global_

defaults:
  - /model: yaak/trajectory_tokenizer/raw
  - /datamodule: yaak/trajectory_train
  - /trainer: default
  - /trainer/callbacks: trajectory_tokenizer
  - /paths: yaak/default
  - /wandb: yaak/rmind
  - _self_

# poses every trajectory_step=10 frames (~1/3 s at 30 fps, = W1's episode_step);
# trajectory_horizon=10 future poses (~3.3 s) for the W2 trajectory policy
# (exp/cond-t2's 403b4rrh used 5 poses, ~1.67 s)
trajectory_horizon: 10
trajectory_step: 10
trajectory_stride: 10
trajectory_clip: "${eval:'${trajectory_horizon} + 1'}"
trajectory_clip_period: "${eval:'${trajectory_step} * ${trajectory_clip}'}i"

# absolute | delta -- see TrajectoryTokenizer's docstring
trajectory_representation: absolute

trajectory_dim: "${eval:'3 * ${trajectory_horizon}'}"
trajectory_hidden_dim: 128
trajectory_latent_dim: 384

codebook_size: 16
num_quantizers: 4

# ~1239 steps/epoch at batch 2048: 40 epochs ~= the 50k-step cosine schedule in
# model/yaak/trajectory_tokenizer/raw.yaml, so the LR actually anneals
trainer:
  max_epochs: 40
