# @package _global_
#
# patch/paper round 2: paper_tok_c10 (MLP RVQ-VAE, 10 x 13 per side, depth 2,
# latent 512) with a BIGGER codebook and a LONG schedule.
#
# * bits: depth 2 x codebook 64 = 12 bits per side-chunk = 0.092 bits/value
#   (paper_tok_c10: 8 bits = 0.062; the Patch Policy / VQ-BeT real-robot
#   settings are ~0.11-0.23 bits/value, paper2_tok_cb256 / _split sit inside);
# * the v3 corpus (2026-10-07 + 2026-10-09, split nero_cube_bimanual_v3,
#   datamodule nero_robot_bimanual_v3_noimg) through the nero_data profile
#   cube_v3_c10 (takes-v3, stats_c10_v3, nero_split_file) under NERO_DATA_ROOT /
#   NERO_STATS_ROOT; no CLI overrides (docs/nero_runs.md);
# * 1000 epochs (paper_tok_c10: 400, val EV still rising), val + checkpoint
#   every 10th epoch, cosine to 0 at the end;
# * lr_total_steps = len(train_dataloader) x max_epochs (nero_steps): v3 has
#   150 batches of 256 (drop_last) x 1000 epochs = 150000.
defaults:
  - /experiment/yaak/nero_robot/paper_tok_c10
  - override /datamodule: yaak/nero_robot_bimanual_v3_noimg
  - override /nero_data@_global_: cube_v3_c10
  - _self_

run_name: paper2_tok_cb64
codebook_size: 64

lr_total_steps: 150000
trainer:
  max_epochs: 1000
  check_val_every_n_epoch: 10

wandb:
  tags: [nero_robot, chunk_tokenizer, bimanual, paper, paper2, c10]
