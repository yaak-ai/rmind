# @package _global_
# bimanual_hand_on_v2 with the tokenizer swapped for bimanual_tokenizer_v2_q32
# (epoch=149-step=9900, sha256 a1ec2a43...), 32 quantizers: the
# policy's code head predicts 32 x 16 codes per side.
# Run experiment (docs/nero_runs.md): `just train experiment=yaak/nero_robot/bimanual_hand_on_tokq32`
# reproduces the run (sisyphos, 63db0f6e); no CLI overrides.
defaults:
  - /experiment/yaak/nero_robot/bimanual_causal
  - /nero_data@_global_: cube_v1_140x224
  - /nero_tokenizer@_global_: bimanual_tokenizer_v2_q32
  - _self_

run_name: bimanual_hand_on_tokq32
num_quantizers: 32
