# @package _global_
#
# Robot-native causal patch policy (contract v3) -- decisions P1-P7, P9.
# docs/nero_robot_patch_policy.md has the reasoning; numbers below are the
# scientist brief's defaults.
#
# CLOCKS. Observations on a 10 Hz grid (every 3rd 30 fps base frame,
# frame_stride 3); actions stay at 30 Hz: a 100-step (3.3 s) chunk per frame.
#
# CONTEXT. window 16 frames (1.6 s) served with a ring of 15, TRAINED on 32-frame
# clips (episode_length > window, attention_impl flex) so the deep, warm K/V the
# serving ring builds after 16 ticks is in distribution, and the loss is on every
# frame, so cold-start frames (serving resets) are in distribution too. flex
# needs attn_dropout 0. ⚠️ Orin latency at 482 tokens/frame is UNMEASURED
# (projected ~165-175 ms at window 16 fp32 vs a 100 ms budget): fallbacks are
# window 8, fewer patches per camera, then fp16 trunk.
#
# SEQUENCE: tokens_per_frame = 1 state + 1 hand + 3 x 160 = 482;
# 32 x 482 = 15424 tokens per clip (checkpointed).
#
# ⚠️ Inputs that must exist first (nero_fit_stats, then the tokenizer
# experiment): NERO_STATS_DIR (standardizers + absolute action stats, TRAIN
# split only) and NERO_TOKENIZER_CKPT (the tokenizer of THIS relative_mode).
# lr_total_steps MUST equal the real optimizer step count (cosine has no clamp).

defaults:
  - /model: yaak/nero_patch_policy/robot
  - /datamodule: yaak/nero_robot
  - /trainer: default
  - /trainer/callbacks: nero_robot
  - /paths: yaak/default
  - /wandb: yaak/rmind
  - _self_

nero_robot_dir: ${oc.env:HOME}/.config/nutron/episodes-pulled/accepted
nero_stats_dir: ${oc.env:NERO_STATS_DIR,.nero_stats}
state_standardizer: ${nero_stats_dir}/state_standardizer.json
hand_standardizer: ${nero_stats_dir}/hand_standardizer.json
action_standardizer: ${nero_stats_dir}/action_standardizer_${relative_mode}.json
tokenizer_ckpt: ${oc.env:NERO_TOKENIZER_CKPT,missing-tokenizer.ckpt}

# --- clocks / windowing (P2, P3)
frame_stride: 3
window: 16
episode_length: 32
# coprime to frame_stride: window starts cycle through all three 30 Hz phases
episode_stride: 7
episode_offset: 0
attention_impl: flex
attn_dropout: 0.0
drop_path_rate: 0.0
chunk_size: 100
keyframe_stride: 3

# --- cameras / image grid (P10: rmind.data.nero_image.preprocess)
cameras: [base, side_left, side_right]
num_cameras: 3
camera_cond_dim: 13
image_height: 140
image_width: 224
image_encoder_name: vit_small_patch14_dinov2.lvd142m
image_embedding_dim: 384
goal_embedding_dim: ${image_embedding_dim} # the kept, always-no_goal channel (P7)
num_patches: 160 # 10 x 16 at patch 14
num_sides: 2

# --- hand token (P6): newest sample only; groups selectable
hand_groups: [current, pos_err]
use_hand_token: 1
hand_token_dim: 14 # 6 + 6 + age + valid (hf.token_dim)
# [] = ONE untagged hand token from `hand.*` (single arm); [left, right] = one
# side-tagged token per side from `hand.{side}.*` (bimanual_causal). Keep
# num_hand_tokens = max(1, len(hand_sides)): the trunk's tokens_per_frame uses it
# (and the model refuses a mismatch on the first batch).
hand_sides: []
num_hand_tokens: 1
hand_dropout_sample: 0.2
hand_dropout_frame: 0.1
reliance_metrics: true

# --- relative actions (P5): none | hand | all, with its OWN standardizer + tokenizer
relative_mode: none

# --- trunk
policy_embedding_dim: 512
num_layers: 8
num_heads: 8

# --- tokenizer geometry (must match the tokenizer checkpoint)
tokenizer_latent_dim: 128
codebook_size: 16
num_quantizers: 16

# --- optimization (placeholders: derive lr_total_steps from the real sample count)
lr: 1e-4
lr_warmup_steps: 500
lr_total_steps: 10000
batch_size: 4
num_train_batches: 1000

trainer:
  max_epochs: 10

wandb:
  tags: [nero_robot, causal_patch_policy]
