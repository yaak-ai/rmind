# @package _global_
# paper_pp_w2_c10_codes with the CONTINUOUS L1 head (action_head l1, patch/l1head)
# in place of codes + offset: isolates the head in the short-chunk regime. The
# tokenizer is still loaded (it owns the chunk-10 action standardizer and the
# horizon) but never encodes or decodes.
defaults:
  - /experiment/yaak/nero_robot/paper_pp_w2_c10_codes
  - /action_head: l1
  - _self_

run_name: paper_pp_w2_c10_l1

wandb:
  tags: [nero_robot, causal_patch_policy, bimanual, hand_off, paper, window2, c10, l1]
