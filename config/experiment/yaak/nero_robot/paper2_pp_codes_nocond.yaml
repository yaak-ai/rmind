# @package _global_
#
# patch/paper round 2, offset ABLATION arm "unconditioned": paper2_pp_codes_cond
# with the code conditioning removed and NOTHING else changed. The cond arm's
# VQ-BeT table (offset_mode table) regresses one (10 x 13) action-space offset
# per (level, code) and sums the chosen codes' entries; here (offset_mode
# action) the head regresses ONE (10 x 13) action-space offset per side from
# the same per-side readout, the same MLP [1024, 1024], added to
# tokenizer.invert(codes) whichever codes are chosen -- not indexed by the
# codes, not through the decoder. Same tokenizer, data, loss (teacher-forced on
# the target codes in training, argmax codes at inference) and recipe.
#
# Launch-time settings as paper2_pp_codes_cond (NERO_TOKENIZER_CKPT,
# codebook_size / num_quantizers of the POLICY, lr_total_steps).
defaults:
  - /experiment/yaak/nero_robot/paper2_pp_codes_cond
  - _self_

run_name: paper2_pp_codes_nocond

model:
  offset_mode: action
  offset_code_conditioning: false
  teacher_force_offset: true
  offset_head:
    _target_: torchvision.ops.MLP
    in_channels: ${policy_embedding_dim}
    hidden_channels: [1024, 1024, "${eval:'${chunk_size} * 13'}"]

wandb:
  tags: [nero_robot, causal_patch_policy, bimanual, hand_off, paper, paper2, window2, c10, offset_nocond]
