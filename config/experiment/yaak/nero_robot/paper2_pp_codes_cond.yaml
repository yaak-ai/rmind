# @package _global_
#
# patch/paper round 2, offset ABLATION arm "conditioned": paper_pp_w2_c10_codes
# (VQ-BeT head with the per-code action-space offset TABLE: one 10 x 13 offset
# per (level, code), the ARGMAX/target codes' entries gathered and summed --
# VQ-BeT Fig. 2, i.e. the offset is indexed by the code) on a round-2 tokenizer.
# Twin: paper2_pp_codes_nocond (same tokenizer, data and recipe, offset NOT
# indexed by the code).
#
# The tokenizer it ran with (pinned, docs/nero_runs.md): paper2_tok_cb64's final
# epoch (epoch=999-step=150000, sha256 60eb4449...), so the POLICY predicts
# codebook_size 64 x num_quantizers 2 (a paper2_tok_split tokenizer would need
# num_quantizers 4: 2 arm + 2 hand levels, 4 x 16 logits per side; cb256: 256 x 2).
# Inference codes are ARGMAX (sample_codes false, the default).
# v3 corpus (2026-10-07 + 2026-10-09, split nero_cube_bimanual_v3): datamodule
# nero_robot_bimanual_v3_cached + the nero_data profile cube_v3_c10_224s
# (takes-v3, stats_c10_v3, the v3 224x224 stretch cache, nero_split_file for the
# arm-selection callback). lr_total_steps (nero_steps): 298 batches of 128 x 124
# epochs = 36952. No CLI overrides.
defaults:
  - /experiment/yaak/nero_robot/paper_pp_w2_c10_codes
  - override /datamodule: yaak/nero_robot_bimanual_v3_cached
  - override /nero_data@_global_: cube_v3_c10_224s
  - override /nero_tokenizer@_global_: paper2_tok_cb64_e999
  - _self_

run_name: paper2_pp_codes_cond
codebook_size: 64
num_quantizers: 2

lr_total_steps: 36952

wandb:
  tags: [nero_robot, causal_patch_policy, bimanual, hand_off, paper, paper2, window2, c10, offset_cond]
