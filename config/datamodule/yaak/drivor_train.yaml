defaults:
  - /dataset/yaak/drivor_train@train.dataset
  - /dataset/yaak/drivor_val@val.dataset
  - _self_

_target_: rmind.datamodules.GenericDataModule
train:
  _target_: rbyte.dataloader.TorchDataNodeDataLoader
  # bumped from 64: the real run showed only ~4GB/24GB VRAM used at batch_size=64
  # (frozen ViT-S backbone + LoRA-only qkv/proj + a lightweight 256-dim decoder is
  # cheap per-sample) -- more headroom to amortize per-step overhead over.
  batch_size: 256
  shuffle: true
  drop_last: true
  collate_fn:
    _target_: rbyte.types.Batch.to_dict
    _partial_: true
  pin_memory: true
  num_workers: 2
  method: thread

val:
  _target_: rbyte.dataloader.TorchDataNodeDataLoader
  batch_size: 32
  shuffle: false
  collate_fn:
    _target_: rbyte.types.Batch.to_dict
    _partial_: true
  pin_memory: true
  num_workers: 2
  method: thread
