---
defaults:
  - /dataset/palletjack/d12@train.dataset
  # val is a SEPARATE template (two held-out drives) -- rbyte's
  # `Dataset.from_config` takes only `samples`/`streams`, so a split cannot be
  # expressed as a filter on `input_id`; two templates is the repo's own car
  # convention (`/dataset/yaak/train@train.dataset`, `/dataset/yaak/val@val.dataset`).
  - /dataset/palletjack/d12_val@val.dataset
  - _self_

_target_: rmind.datamodules.GenericDataModule
train:
  _target_: rbyte.dataloader.NodeDataLoader
  batch_size: 2
  shuffle: true
  drop_last: true
  collate_fn:
    _target_: rbyte.types.Batch.to_dict
    _partial_: true
  pin_memory: true
  num_workers: 2
  method: thread

val:
  _target_: rbyte.dataloader.NodeDataLoader
  batch_size: 2
  shuffle: false
  collate_fn:
    _target_: rbyte.types.Batch.to_dict
    _partial_: true
  pin_memory: true
  num_workers: 2
  method: thread
