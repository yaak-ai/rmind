---
# train and val share the dataset on purpose: this is an overfit check, and val
# loss is the "did it memorise the cards and zero the rest" signal, not a
# generalization one.
defaults:
  - /dataset/palletjack/cards_with_background@train.dataset
  - /dataset/palletjack/cards_with_background@val.dataset
  - _self_

_target_: rmind.datamodules.GenericDataModule
train:
  _target_: rbyte.dataloader.NodeDataLoader
  batch_size: 32
  shuffle: true
  drop_last: true
  collate_fn:
    _target_: rbyte.types.Batch.to_dict
    _partial_: true
  pin_memory: true
  num_workers: 2
  method: thread

val:
  _target_: rbyte.dataloader.NodeDataLoader
  batch_size: 32
  shuffle: false
  collate_fn:
    _target_: rbyte.types.Batch.to_dict
    _partial_: true
  pin_memory: true
  num_workers: 2
  method: thread
