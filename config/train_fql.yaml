defaults:
  - model: fql
  - datamodule: fql
  - _self_
seed: 0
matmul_precision: highest
wandb:
  mode: disabled
  project: rmind-fql
trainer:
  _target_: pytorch_lightning.Trainer
  accelerator: gpu
  devices: 1
  precision: 32-true
  benchmark: false
  max_steps: 1000000
  max_epochs: -1
  accumulate_grad_batches: 1
  gradient_clip_val: null
  logger: false
  log_every_n_steps: 100
  check_val_every_n_epoch: 1
