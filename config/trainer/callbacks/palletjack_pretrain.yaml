---
# `pretrain` minus the callbacks coupled to the car: no waypoints logger (the
# palletjack has no route) and no `discrete` embedding logging (no discrete
# actions). The foresight/patch-similarity loggers need `meta/sample_id` in the
# batch, which a real dataset provides but the command-card one does not.
# optional warm start from a car checkpoint - see `palletjack_overfit` for what
# transfers. Set neither key to pretrain from scratch.
- _target_: rmind.callbacks.CheckpointWeightLoader
  checkpoint_path: ${pretrained_checkpoint}
  artifact: ${pretrained_artifact}
  exclude:
    - objectives
- _target_: rmind.callbacks.LogitBiasSetter
- _target_: rmind.callbacks.ModuleFreezer
  types:
    - rmind.components.timm_backbone.TimmBackbone
- _target_: pytorch_lightning.callbacks.TQDMProgressBar
- _target_: pytorch_lightning.callbacks.ModelSummary
  max_depth: 5
- _target_: pytorch_lightning.callbacks.ModelCheckpoint
  every_n_epochs: 1
  save_on_train_epoch_end: True
- _target_: pytorch_lightning.callbacks.LearningRateMonitor
  logging_interval: step
- _target_: rmind.callbacks.WandbAttentionMaskLogger
- _target_: rmind.callbacks.WandbImageParamLogger
  when: on_train_batch_end
  every_n_batch: 100
  key: similarity
  select:
    - [episode_builder, embeddings, continuous]
    - [episode_builder, role_encoding, weight]
  apply:
    _target_: torchmetrics.functional.pairwise_cosine_similarity
    _partial_: true
- _target_: rmind.callbacks.WandbPatchSimilarityLogger
  when: on_train_batch_end
  key: patch_similarities
  image_sources:
    cam_left_backward: [foresight, cam_left_backward]
  embeddings_predict: [forward_dynamics, _artifacts, last_embeddings]
  embeddings_target: [forward_dynamics, _artifacts, last_targets]
  sample_id_path: [data, meta/sample_id]
  every_n_sample: 1000
  patch_grid_size: 16
- _target_: rmind.callbacks.WandbPatchSimilarityLogger
  when: on_validation_batch_end
  key: patch_similarities
  image_sources:
    cam_left_backward: [foresight, cam_left_backward]
  embeddings_predict: [forward_dynamics, _artifacts, last_embeddings]
  embeddings_target: [forward_dynamics, _artifacts, last_targets]
  sample_id_path: [data, meta/sample_id]
  every_n_sample: 1000
  patch_grid_size: 16
- _target_: rmind.callbacks.WandbForesightMetricsLogger
  key: foresight
  image_sources:
    cam_left_backward: [foresight, cam_left_backward]
  embeddings_predict: [forward_dynamics, _artifacts, last_embeddings]
  embeddings_target: [forward_dynamics, _artifacts, last_targets]
  hot_quantile: 0.05
  max_hot_pairs: 50000
