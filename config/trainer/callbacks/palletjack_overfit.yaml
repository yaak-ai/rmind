---
# NOTE: CheckpointWeightLoader must precede ModuleFreezer - both act in `setup`,
# and weights have to land before anything is frozen.
- _target_: rmind.callbacks.CheckpointWeightLoader
  # a local .ckpt, or a wandb artifact via `pretrained_artifact` - set neither to
  # train from scratch (the DINOv3 backbone is pretrained from timm regardless)
  checkpoint_path: ${pretrained_checkpoint}
  artifact: ${pretrained_artifact}
  # No exclusions needed: name + shape matching is sufficient in both directions.
  #
  # From a *car* checkpoint, the encoder, image backbone/projection and
  # summary/foresight/utility embeddings transfer (they mean the same thing on any
  # embodiment); the action embeddings and objective heads do not match by name
  # (`traction` vs `gas_pedal`, `policy` vs `inverse_dynamics`) so they stay
  # randomly initialized.
  #
  # From an earlier *palletjack* checkpoint everything transfers, policy heads
  # included - which is what makes adding the background class a short finetune
  # rather than a full retrain. Renaming the camera does not interfere: the camera
  # name appears only in `timestep`, `special_tokens` and the `Remapper` paths,
  # none of which are parameters.
- _target_: rmind.callbacks.ModuleFreezer
  paths:
    # keep the DINOv3 backbone frozen: nothing here needs it adapted, and the
    # augmentation in `input_transform` stays live because it sits outside
    - episode_builder.embeddings.image
- _target_: pytorch_lightning.callbacks.ModelSummary
  max_depth: 3
- _target_: pytorch_lightning.callbacks.ModelCheckpoint
  every_n_epochs: 1
  save_on_train_epoch_end: True
- _target_: pytorch_lightning.callbacks.LearningRateMonitor
  logging_interval: step
