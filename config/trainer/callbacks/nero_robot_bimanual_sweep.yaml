# nero_robot_bimanual for the patch/sweep runs: every epoch kept, weights only, no last.ckpt
# (rmind.callbacks.nero_arm_selection; take classes from the shared split JSON)
- _target_: pytorch_lightning.callbacks.ModelSummary
  max_depth: 2
- _target_: pytorch_lightning.callbacks.ModelCheckpoint
  # = trainer.check_val_every_n_epoch: a checkpoint for every validated epoch
  every_n_epochs: ${oc.select:trainer.check_val_every_n_epoch,1}
  save_on_train_epoch_end: True
  save_last: False
  # sweep: weights only (~205 MB, not ~436 MB with the AdamW state) -- the disk
  # holds ~10 runs x 10-20 epochs only this way; no run is meant to be resumed
  save_weights_only: True
  # Keep EVERY epoch (~430 MB each): on the 85-take corpus val loss bottoms out
  # around epoch 2-3 and then rises, and with the default save_top_k=1 (no
  # monitor) only the last epoch survived. Pick the epoch from the val curves.
  save_top_k: -1
- _target_: pytorch_lightning.callbacks.LearningRateMonitor
  logging_interval: step
- _target_: rmind.callbacks.TrainingQualityLogger
  every_n_steps: 50
  val_train_ratio_alarm: 2.0
  alarm_after_step: ${lr_warmup_steps}
- _target_: rmind.callbacks.nero_arm_selection.NeroArmSelectionLogger
  split_file: ${oc.select:nero_split_file,null}
  # one extra trunk forward per val batch on the epochs it runs (~2x val compute);
  # raise to thin it out if val is too slow (the last epoch always computes it)
  every_n_epochs: ${oc.select:nero_arm_select_every_n_epochs,1}
