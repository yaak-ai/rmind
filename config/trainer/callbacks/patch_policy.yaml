- _target_: rmind.components.dataloader.DistributedSamplerEpochSetter
- _target_: pytorch_lightning.callbacks.ModelSummary
  max_depth: 3
- _target_: pytorch_lightning.callbacks.ModelCheckpoint
  every_n_epochs: 1
  save_on_train_epoch_end: True
# Mid-epoch safety net: one epoch on the full train set is ~106k steps (~4 days),
# so an epoch-only checkpoint leaves a run with nothing on disk for days at a time.
# This must be a SEPARATE callback -- ModelCheckpoint rejects every_n_train_steps
# and every_n_epochs on the same instance ("should be mutually exclusive").
# monitor is unset, so save_top_k=1 just keeps rewriting the latest snapshot.
- _target_: pytorch_lightning.callbacks.ModelCheckpoint
  every_n_train_steps: 5000
  save_top_k: 1
  filename: "step-{step}"
- _target_: pytorch_lightning.callbacks.LearningRateMonitor
  logging_interval: step
- _target_: rmind.callbacks.GpuMemoryStatsCallback
  every_n_steps: 100000
- _target_: rmind.callbacks.PredictMetricsCallback
  prediction_config:
    objectives:
      - score_l1
      - score_signed_error
  cluster_fn:
    _target_: rmind.utils.RuleBasedCluster
    fields:
      gas:
        key: meta/VehicleMotion/gas_pedal_normalized
        reduce: last
      brake:
        key: meta/VehicleMotion/brake_pedal_normalized
        reduce: last
      steer:
        key: meta/VehicleMotion/steering_angle_normalized
        reduce: last
      dp_g:
        key: meta/VehicleMotion/gas_pedal_normalized
        reduce: last_diff
      speed:
        key: meta/VehicleMotion/speed
        reduce: last
    rules:
      - name: highway
        when: {speed: {ge: 70}}
      - name: braking_turn
        when: {brake: {ge: 0.02}, steer: {abs_ge: 0.05}}
      - name: braking
        when: {brake: {ge: 0.02}, steer: {abs_lt: 0.05}}
      - name: cruise_turn
        when: {gas: {ge: 0.05}, brake: {lt: 0.02}, steer: {abs_ge: 0.05}}
      - name: acceleration
        when: {gas: {ge: 0.05}, brake: {lt: 0.02}, dp_g: {ge: 0.01}}
      - name: gas_release
        when: {gas: {ge: 0.05}, brake: {lt: 0.02}, dp_g: {lt: -0.01}}
      - name: cruise
        when: {gas: {ge: 0.05}, brake: {lt: 0.02}, steer: {abs_lt: 0.05}, dp_g: {abs_lt: 0.01}}
    default: idle_coast
  cluster_metrics:
    acceleration:
      - policy/score_l1/value/continuous/gas_pedal
      - policy/score_signed_error/value/continuous/gas_pedal
    cruise_turn:
      - policy/score_l1/value/continuous/steering_angle
    braking_turn:
      - policy/score_l1/value/continuous/brake_pedal
      - policy/score_l1/value/continuous/steering_angle
    braking:
      - policy/score_l1/value/continuous/brake_pedal
    highway:
      - policy/score_l1/value/continuous/gas_pedal
      - policy/score_signed_error/value/continuous/gas_pedal
- _target_: rmind.callbacks.TrainingQualityLogger
  every_n_steps: 100
