_target_: rmind.models.patch_policy.PatchPolicy.load_for_mode_head_training
_recursive_: false
_convert_: all

# Attach and train a trajectory-mode classifier on a FROZEN checkpoint
# (freeze_base=True is set inside load_for_mode_head_training): weights +
# hparams come from the artifact, only mode_head (+ the new "mode" loss) train.
artifact: ${mode_head_artifact}

mode_head:
  _target_: torchvision.ops.MLP
  in_channels: ${policy_embedding_dim}
  hidden_channels: [256, "${num_trajectory_hypotheses}"]

mode_loss:
  _target_: torch.nn.CrossEntropyLoss

optimizer:
  _target_: rmind.components.optimizers.SelectiveAdamW
  _recursive_: true
  lr: ${lr}
  betas: [0.9, 0.95]
  weight_decay: 0.1
  weight_decay_module_blacklist:
    - _target_: hydra.utils.get_class
      path: torch.nn.Embedding
    - _target_: hydra.utils.get_class
      path: torch.nn.LayerNorm

lr_scheduler: null
