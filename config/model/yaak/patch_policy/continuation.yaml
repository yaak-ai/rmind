_target_: rmind.models.patch_policy.PatchPolicy.load_for_continuation
_recursive_: false
_convert_: all

# Warm start from a finished run's checkpoint: weights + hparams from the
# artifact; ONLY the optimization config is replaced (fresh optimizer state,
# constant LR -- no scheduler, no warmup).
artifact: ${continuation_artifact}

optimizer:
  _target_: rmind.components.optimizers.SelectiveAdamW
  _recursive_: true
  lr: ${lr}
  betas: [0.9, 0.95]
  weight_decay: 0.1
  weight_decay_module_blacklist:
    - _target_: hydra.utils.get_class
      path: torch.nn.Embedding
    - _target_: hydra.utils.get_class
      path: torch.nn.LayerNorm

lr_scheduler: null

# null = keep the checkpoint's loss weights; a map overrides the named ones
# (PatchPolicy.CONTINUATION_LOSS_WEIGHTS), e.g. for data without CAN labels.
loss_weights: ${oc.select:continuation_loss_weights,null}

# null = keep the checkpoint's; true = route input off (null_goal in train AND
# val, a permanent goal dropout), e.g. the pai_ft_nogoal arm.
goal_absent: ${oc.select:continuation_goal_absent,null}

# null = keep the checkpoint's; a HydraConfig sets the train-only speed-input
# augmentation (PatchPolicy speed_augment), e.g. pai_ft_nogoal_speedshift.
speed_augment: ${oc.select:continuation_speed_augment,null}
