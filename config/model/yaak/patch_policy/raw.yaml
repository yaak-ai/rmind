_target_: rmind.models.patch_policy.PatchPolicy
_recursive_: false
_convert_: all

input_transform:
  _target_: torch.nn.Sequential
  _convert_: all
  _args_:
    - _target_: rmind.components.nn.Remapper
      paths:
        image:
          cam_front_left: [data, cam_front_left]

        continuous:
          speed: [data, meta/VehicleMotion/speed]
          gas_pedal: [data, meta/VehicleMotion/gas_pedal_normalized]
          brake_pedal: [data, meta/VehicleMotion/brake_pedal_normalized]
          steering_angle: [data, meta/VehicleMotion/steering_angle_normalized]

        context:
          waypoints: [data, waypoints/xy_normalized]
          heading: [data, headings_denoised/heading]
          time_stamp: [data, "meta/ImageMetadata.cam_front_left/time_stamp"]

        discrete:
          turn_signal: [data, meta/VehicleState/turn_signal]

    # dead-reckoned per-frame trajectory ground truth (DrivoR, arXiv:2601.05083)
    # for the auxiliary trajectory head below -- MUST run before `ChunkFields`,
    # on the raw un-narrowed `context.heading`/`context.time_stamp`/
    # `continuous.speed` (still spanning the full clip, not yet truncated to
    # `episode_length`), and write into the EXISTING `context` key so the
    # `ModuleDict` stage further down doesn't need a new entry.
    - _target_: rmind.components.nn.TrajectoryTarget
      speed: [continuous, speed]
      heading: [context, heading]
      time_stamp: [context, time_stamp]
      out: [context, trajectory_target]
      episode_length: ${episode_length}
      num_poses: ${trajectory_horizon}

    - _target_: rmind.components.nn.ChunkFields
      episode_length: ${episode_length}
      action_horizon: ${action_horizon}
      unfold_paths:
        - [continuous, gas_pedal]
        - [continuous, brake_pedal]
        - [continuous, steering_angle]
        - [discrete, turn_signal]

    - _target_: rmind.components.containers.ModuleDict
      modules:
        image:
          _target_: torch.nn.Sequential
          _args_:
            - _target_: einops.layers.torch.Rearrange
              pattern: "... h w c -> ... c h w"
            - _target_: torchvision.transforms.v2.CenterCrop
              size: [320, 576]
            - _target_: torchvision.transforms.v2.Resize
              size: ${image_resize}
            - _target_: torchvision.transforms.v2.ToDtype
              scale: true
              dtype:
                _target_: hydra.utils.get_object
                path: torch.float32
            - _target_: rmind.components.norm.ImageNormalize
              mean: [0.485, 0.456, 0.406]
              std: [0.229, 0.224, 0.225]

        continuous:
          _target_: rmind.components.nn.AtLeast3D

        discrete:
          _target_: rmind.components.nn.AtLeast3D

        context:
          _target_: torch.nn.Identity

    - _target_: rmind.components.nn.StackFields
      out_key: joint_actions
      # turn_signal deliberately excluded (docs/action_tokenizer_repair_plan.md
      # Phase 2b): it is a 3-way categorical, not a continuous quantity the RVQ
      # should be reconstructing, and it stays available to `turn_signal_head`
      # below via ChunkFields' `[discrete, turn_signal]` unfold, unaffected by
      # this narrowing.
      paths:
        gas_pedal: [continuous, gas_pedal]
        brake_pedal: [continuous, brake_pedal]
        steering_angle: [continuous, steering_angle]

image_encoder:
  _target_: torch.nn.Sequential
  _args_:
    - _target_: rmind.components.timm_backbone.TimmBackbone
      model_name: ${image_encoder_name}
      out_indices: [10]
      img_size: ${image_resize}
    - _target_: einops.layers.torch.Rearrange
      pattern: "... c h w -> ... (h w) c"

goal_encoder:
  _target_: rmind.models.waypoints_tokenizer.WaypointsTokenizer.load_from_wandb_artifact
  artifact: ${waypoints_tokenizer_artifact}
  weights_only: false

# T x P x (D + G) -> policy width (https://arxiv.org/pdf/2607.18236 section 2.1)
patch_projection:
  _target_: rmind.components.nn.Linear
  in_features: "${eval:'${image_embedding_dim} + ${waypoint_latent_dim}'}"
  out_features: ${policy_embedding_dim}

speed_tokenizer:
  _target_: rmind.components.norm.UniformBinner
  range: [0.0, 130.0]
  bins: ${speed_bins}

speed_embedding:
  _target_: rmind.components.nn.Embedding
  num_embeddings: ${speed_bins}
  embedding_dim: ${policy_embedding_dim}

encoder:
  _target_: rmind.models.patch_policy.BlockCausalTransformer
  dim_model: ${policy_embedding_dim}
  num_layers: ${num_layers}
  num_heads: ${num_heads}
  # episode_length frames x (num_patches + 1 speed token)
  max_sequence_length: "${eval:'${episode_length} * (${num_patches} + 1)'}"
  checkpoint: ${trunk_checkpointing}

tokenizer:
  _target_: rmind.models.action_tokenizer.ActionTokenizer.load_from_wandb_artifact
  artifact: ${action_tokenizer_artifact}
  weights_only: false

norm:
  _target_: torch.nn.LayerNorm
  normalized_shape: ${policy_embedding_dim}

code_head:
  _target_: torchvision.ops.MLP
  in_channels: ${policy_embedding_dim}
  hidden_channels: [1024, 1024, 64] # 4 quantizers x 16 codes

offset_head:
  _target_: torchvision.ops.MLP
  in_channels: ${policy_embedding_dim}
  # 4 quantizers x 16 codes x 18 action dims (action_horizon 6 x 3 continuous
  # fields -- turn_signal is out of the RVQ, see StackFields above)
  hidden_channels: [1024, 1024, 1152]

# categorical turn-signal head (docs/action_tokenizer_repair_plan.md Phase 2b):
# action_horizon x 3 classes (OFF/LEFT/RIGHT), on the same readout feature as
# code_head/offset_head. See PatchPolicy docstring for the served-contract
# reasoning (joint_actions stays 4-channel).
turn_signal_head:
  _target_: torchvision.ops.MLP
  in_channels: ${policy_embedding_dim}
  hidden_channels: [1024, 1024, "${eval:'${action_horizon} * 3'}"]

# auxiliary, non-VQ trajectory head (docs/phase3_trajectory_head_plan.md):
# architecture piece defined here (null = off, every existing arm's
# behaviour unaffected); only an experiment that actually wants the arm
# (dinov3.yaml) instantiates the real MLP and sets model.trajectory_weight.
trajectory_head: null
num_trajectory_hypotheses: ${num_trajectory_hypotheses}

# trajectory-mode classifier (see PatchPolicy docstring): reads the same
# readout feature as trajectory_head, trained to predict the winner-takes-all
# oracle's best_index. null = off (requires trajectory_head); an experiment
# that wants it instantiates the real MLP, output width
# num_trajectory_hypotheses.
mode_head: null

losses:
  _target_: rmind.components.containers.ModuleDict
  modules:
    code:
      _target_: rmind.components.loss.FocalLoss
    offset:
      _target_: torch.nn.L1Loss
    turn_signal:
      _target_: torch.nn.CrossEntropyLoss
    # safe to always define -- the validation gate in PatchPolicy.__init__
    # only fires when trajectory_head is not None
    trajectory:
      _target_: rmind.components.loss.WinnerTakesAllPoseLoss
      heading_weight: ${trajectory_heading_weight}
    # safe to always define -- the validation gate in PatchPolicy.__init__
    # only fires when mode_head is not None
    mode:
      _target_: torch.nn.CrossEntropyLoss

teacher_force_offset: ${teacher_force_offset}

# neighbour-aware label smoothing (OPT-IN, default off = uniform smoothing).
# Set a global `neighbor_smoothing_tau` (e.g. 0.02) in an experiment to spread
# FocalLoss's smoothing mass by decoded-action distance instead of uniformly:
# measured at tau=0.02, uniform smoothing puts 50.0% of its mass on the farther
# half of the codebook vs 13.7% distance-aware, keeping 0.389 on the true code
# (effective support ~7 of 16 codes). Requires losses.modules.code to be a
# FocalLoss with label_smoothing > 0.
neighbor_smoothing_tau: ${oc.select:neighbor_smoothing_tau,null}

# scale-balanced fusion: LN + learnable gain on patches, RVQ-calibrated
# learnable gain on the goal latent (see PatchPolicy docstring)
fusion_norm: ${fusion_norm}

optimizer:
  _target_: rmind.components.optimizers.SelectiveAdamW
  _recursive_: true
  lr: ${lr}
  betas: [0.9, 0.95]
  weight_decay: 0.1
  weight_decay_module_blacklist:
    - _target_: hydra.utils.get_class
      path: torch.nn.Embedding
    - _target_: hydra.utils.get_class
      path: torch.nn.LayerNorm

# NOTE: the schedule oscillates if trained past num_training_steps (the cosine
# comes back up) -- size lr_total_steps to the actual planned optimizer steps.
lr_scheduler:
  interval: step
  scheduler:
    _target_: rmind.components.lr_schedulers.get_cosine_schedule_with_warmup
    num_warmup_steps: ${lr_warmup_steps}
    num_training_steps: ${lr_total_steps}
