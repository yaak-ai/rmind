_target_: rmind.models.trajectory_tokenizer.TrajectoryTokenizer
_recursive_: false
_convert_: all

input_transform:
  _target_: torch.nn.Sequential
  _convert_: all
  _args_:
    - _target_: rmind.components.nn.Remapper
      paths:
        continuous:
          speed: [data, meta/VehicleMotion/speed]
          steering_angle: [data, meta/VehicleMotion/steering_angle_normalized]
        context:
          heading: [data, headings_denoised/heading]
          time_stamp: [data, "meta/ImageMetadata.cam_front_left/time_stamp"]

    # the SAME dead-reckoned target patch_policy's trajectory head trains on
    # (config/model/yaak/patch_policy/raw.yaml), at a single anchor (the clip's
    # first frame): (b, 1, trajectory_horizon, 3) ego-frame (x, y, theta)
    - _target_: rmind.components.nn.TrajectoryTarget
      speed: [continuous, speed]
      heading: [context, heading]
      time_stamp: [context, time_stamp]
      out: [context, trajectory_target]
      # heading cleanup: bicycle model (steering + speed) below 20 km/h and for steps
      # whose heading jump disagrees with it by > 10 deg (filter glitches)
      steering: [continuous, steering_angle]
      heading_cleanup:
        wheelbase_m: 2.70
        road_wheel_deg_per_unit: 29.9
        low_speed_kmh: 20.0
        max_jump_deg: 10.0
      # mean speed + mid-step heading per 1/3 s step (start-of-step values are biased
      # ~+-1 m over 3.3 s under braking/acceleration; trapezoid matches 30 Hz vs GNSS)
      integration: trapezoid
      episode_length: 1
      num_poses: ${trajectory_horizon}

trajectory: [context, trajectory_target]
num_poses: ${trajectory_horizon}
representation: ${trajectory_representation}

encoder:
  _target_: torch.nn.Sequential
  _args_:
    - _target_: rmind.components.nn.Linear
      in_features: ${trajectory_dim}
      out_features: ${trajectory_hidden_dim}
    - _target_: torch.nn.GELU
    - _target_: rmind.components.nn.Linear
      in_features: ${trajectory_hidden_dim}
      out_features: ${trajectory_latent_dim}

quantizer:
  _target_: rmind.components.vq.ResidualVQ
  dim: ${trajectory_latent_dim}
  codebook_size: ${codebook_size}
  num_quantizers: ${num_quantizers}

decoder:
  _target_: torch.nn.Sequential
  _args_:
    - _target_: rmind.components.nn.Linear
      in_features: ${trajectory_latent_dim}
      out_features: ${trajectory_hidden_dim}
    - _target_: torch.nn.GELU
    - _target_: rmind.components.nn.Linear
      in_features: ${trajectory_hidden_dim}
      out_features: ${trajectory_dim}

# recon = L1(xy, meters) + heading_weight * |wrapped theta error| (radians):
# 0.1 rad ~ 1 m, roughly the lateral miss a 0.1 rad heading error causes
# ~10 m ahead.
heading_weight: 10.0
delta_weight: 0.0
norm_warmup_steps: 100

commitment_weight: 1.0
vq_weight: 5.0

optimizer:
  _target_: rmind.components.optimizers.SelectiveAdamW
  _recursive_: true
  lr: 5.5e-5
  betas: [0.9, 0.95]
  weight_decay: 0.1
  weight_decay_module_blacklist:
    - _target_: hydra.utils.get_class
      path: torch.nn.Embedding
    - _target_: hydra.utils.get_class
      path: torch.nn.LayerNorm

lr_scheduler:
  interval: step
  scheduler:
    _target_: rmind.components.lr_schedulers.get_cosine_schedule_with_warmup
    num_warmup_steps: 2500
    num_training_steps: 50000
