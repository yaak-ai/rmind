_target_: rmind.models.zero.Zero
_recursive_: false
_convert_: all

episode_builder:
  _target_: rmind.components.episode.EpisodeBuilder
  _recursive_: true
  _convert_: all
  # NOTE: the latent (RouteWorldLatent) reads the raw DINO patches and waypoints
  # directly; no objective reads the encoder / OS / AS any more.
  timestep:
    - [observation, image, cam_front_left]
  special_tokens:
    utility:
      latent:
        _target_: builtins.range
        _args_: [0, 64]
      inv:
        _target_: builtins.range
        _args_: [64, 72]
      policy:
        _target_: builtins.range
        _args_: [72, 80]
      fwd:
        _target_: builtins.range
        _args_: [80, 336]
      speed:  # query of FWD's separate speed decoder
        _target_: builtins.range
        _args_: [336, 337]

  input_transform:
    _target_: torch.nn.Sequential
    _convert_: all
    _args_:
      - _target_: rmind.components.nn.Remapper
        paths:
          image:
            cam_front_left: [data, cam_front_left]

          continuous:
            speed: [data, meta/VehicleMotion/speed]
            gas_pedal: [data, meta/VehicleMotion/gas_pedal_normalized]
            gas_pedal_diff: [data, meta/VehicleMotion/gas_pedal_normalized]
            brake_pedal: [data, meta/VehicleMotion/brake_pedal_normalized]
            brake_pedal_diff: [data, meta/VehicleMotion/brake_pedal_normalized]
            steering_angle: [data, meta/VehicleMotion/steering_angle_normalized]
            steering_angle_diff:
              [data, meta/VehicleMotion/steering_angle_normalized]

          context:
            waypoints: [data, waypoints/xy_normalized]

          discrete:
            turn_signal: [data, meta/VehicleState/turn_signal]

      # POLICY look-ahead: stack the raw per-step actions at full clip length, then
      # unfold that single field into `episode_length` windows of `clip_horizon` steps;
      # POLICY drops the current step, keeping the strictly-future action_clip=6 chunk.
      # Doing it as ONE field (not per-channel copies) avoids cascading extra fields
      # through every downstream ModuleDict stage.
      - _target_: rmind.components.nn.StackFields
        out_key: joint_actions_chunk
        paths:
          gas_pedal: [continuous, gas_pedal]
          brake_pedal: [continuous, brake_pedal]
          steering_angle: [continuous, steering_angle]
          turn_signal: [discrete, turn_signal]

      # chunk unfold FIRST (needs the full future tail before the h=1 unfold narrows it)
      - _target_: rmind.components.nn.ChunkFields
        episode_length: ${episode_length}
        action_horizon: ${clip_horizon}
        unfold_paths:
          - [joint_actions_chunk]

      - _target_: rmind.components.nn.ChunkFields
        episode_length: ${episode_length}
        action_horizon: ${action_horizon}
        unfold_paths:
          - [continuous, gas_pedal]
          - [continuous, brake_pedal]
          - [continuous, steering_angle]
          - [discrete, turn_signal]

      - _target_: rmind.components.containers.ModuleDict
        modules:
          image:
            _target_: torch.nn.Sequential
            _args_:
              - _target_: einops.layers.torch.Rearrange
                pattern: "... h w c -> ... c h w"
              - _target_: torchvision.transforms.v2.CenterCrop
                size: [320, 576]
              - _target_: torchvision.transforms.v2.Resize
                size: [256, 256]
              - _target_: torchvision.transforms.v2.ToDtype
                scale: true
                dtype:
                  _target_: hydra.utils.get_object
                  path: torch.float32
              - _target_: torchvision.transforms.v2.Normalize
                mean: [0.485, 0.456, 0.406]
                std: [0.229, 0.224, 0.225]

          continuous:
            speed:
              _target_: rmind.components.nn.AtLeast3D

            gas_pedal:
              _target_: rmind.components.nn.AtLeast3D

            gas_pedal_diff:
              _target_: rmind.components.nn.Sequential
              _args_:
                # drop the action_horizon=1 chunk axis so DiffLast diffs over T
                - _target_: rmind.components.nn.Squeeze
                  dim: -1
                - _target_: rmind.components.nn.DiffLast
                  append:
                    _target_: hydra.utils.get_object
                    path: math.nan

            brake_pedal:
              _target_: rmind.components.nn.AtLeast3D

            brake_pedal_diff:
              _target_: rmind.components.nn.Sequential
              _args_:
                - _target_: rmind.components.nn.Squeeze
                  dim: -1
                - _target_: rmind.components.nn.DiffLast
                  append:
                    _target_: hydra.utils.get_object
                    path: math.nan

            steering_angle:
              _target_: rmind.components.nn.AtLeast3D

            steering_angle_diff:
              _target_: rmind.components.nn.Sequential
              _args_:
                - _target_: rmind.components.nn.Squeeze
                  dim: -1
                - _target_: rmind.components.nn.DiffLast
                  append:
                    _target_: hydra.utils.get_object
                    path: math.nan

          discrete:
            _target_: rmind.components.nn.AtLeast3D

          context:
            _target_: torch.nn.Identity

          # unfold appends the window as the last axis: (b, t, action_space, horizon)
          # -> reorder to (b, t, horizon, action_space) for the chunk tokenizer
          joint_actions_chunk:
            _target_: einops.layers.torch.Rearrange
            pattern: "b t a w -> b t w a"

      - _target_: rmind.components.nn.StackFields
        out_key: joint_actions
        paths:
          gas_pedal: [continuous, gas_pedal]
          brake_pedal: [continuous, brake_pedal]
          steering_angle: [continuous, steering_angle]
          turn_signal: [discrete, turn_signal]

  tokenizers:
    _target_: rmind.components.containers.ModuleDict
    modules:
      image:
        _target_: rmind.components.nn.Identity

      continuous:
        speed:
          _target_: rmind.components.norm.UniformBinner
          range: [0.0, 130.0]
          bins: ${speed_bins}

        gas_pedal:
          _target_: rmind.components.norm.UniformBinner
          range: [0.0, 1.0]
          bins: ${gas_pedal_bins}

        gas_pedal_diff:
          # NOTE: no pre-mulaw scaling since if x in [0.0, 1.0] then dx in [-1.0, 1.0]
          _target_: rmind.components.norm.MuLawEncoding
          quantization_channels: ${gas_pedal_bins}

        brake_pedal:
          _target_: rmind.components.norm.UniformBinner
          range: [0.0, 1.0]
          bins: ${brake_pedal_bins}

        brake_pedal_diff:
          # NOTE: no pre-mulaw scaling since if x in [0.0, 1.0] then dx in [-1.0, 1.0]
          _target_: rmind.components.norm.MuLawEncoding
          quantization_channels: ${brake_pedal_bins}

        steering_angle:
          _target_: rmind.components.norm.UniformBinner
          range: [-1.0, 1.0]
          bins: ${steering_angle_bins}

        steering_angle_diff:
          _target_: rmind.components.nn.Sequential
          _args_:
            - _target_: rmind.components.norm.Scaler
              in_range: [-2.0, 2.0]
              out_range: [-1.0, 1.0]
            - _target_: rmind.components.norm.MuLawEncoding
              quantization_channels: ${steering_angle_bins}

      discrete:
        _target_: rmind.components.nn.Identity

      context:
        waypoints:
          _target_: rmind.components.nn.Identity

      joint_actions:
        _target_: rmind.models.action_tokenizer.ActionTokenizer.load_from_wandb_artifact
        artifact: yaak/rmind/model-m35hyvbp:v9
        weights_only: false

      joint_actions_chunk:  # raw look-ahead chunk; POLICY tokenizes it with opdsul88
        _target_: rmind.components.nn.Identity

  embeddings:
    _target_: rmind.components.containers.ModuleDict
    modules:
      image:
        _target_: torch.nn.Sequential
        _args_:
          - _target_: rmind.components.timm_backbone.TimmBackbone
            model_name: vit_small_patch16_dinov3.lvd1689m
            out_indices: [10]
            img_size: [256, 256]
          - _target_: einops.layers.torch.Rearrange
            pattern: "... c h w -> ... (h w) c"

      continuous:
        speed: null
        gas_pedal: null
        brake_pedal: null
        steering_angle: null
        gas_pedal_diff: null
        brake_pedal_diff: null
        steering_angle_diff: null

      context:
        waypoints: null

      discrete:
        turn_signal: null

      utility:
        _target_: rmind.components.nn.Embedding
        num_embeddings: 337
        embedding_dim: ${encoder_embedding_dim}

      joint_actions: null
      joint_actions_chunk: null

  projections:
    _target_: rmind.components.containers.ModuleDict
    modules:
      image:
        _target_: torch.nn.Sequential
        _args_:
          - _target_: torch.nn.LayerNorm
            normalized_shape: ${image_embedding_dim}
          - _target_: rmind.components.nn.Linear
            in_features: ${image_embedding_dim}
            out_features: ${encoder_embedding_dim}

      continuous:
        speed: null
        gas_pedal: null
        brake_pedal: null
        steering_angle: null
        gas_pedal_diff: null
        brake_pedal_diff: null
        steering_angle_diff: null

      context:
        waypoints: null

      discrete:
        turn_signal: null

      utility: # do we need it?
        _target_: torch.nn.Sequential
        _args_:
          - _target_: torch.nn.LayerNorm
            normalized_shape: ${encoder_embedding_dim}
          - _target_: rmind.components.nn.Linear
            in_features: ${encoder_embedding_dim}
            out_features: ${encoder_embedding_dim}

      joint_actions: null
      joint_actions_chunk: null

  role_encoding: # (modality, type)
    _target_: torch.nn.Sequential
    _args_:
      - _target_: rmind.components.nn.Embedding
        num_embeddings: 8
        embedding_dim: ${encoder_embedding_dim}
      - _target_: torch.nn.LayerNorm
        normalized_shape: ${encoder_embedding_dim}
      - _target_: rmind.components.nn.Linear
        in_features: ${encoder_embedding_dim}
        out_features: ${encoder_embedding_dim}

  token_mask: null

  attention_mask_builder:
    _target_: rmind.components.mask.FactorizedCausalAttentionMaskBuilder

encoder:
  # unused: the latent reads DINO patches + waypoints directly and no objective reads the
  # encoder output, so the transformer encoder is replaced by a no-op
  _target_: rmind.components.nn.NoEncoder

optimizer:
  _target_: rmind.components.optimizers.SelectiveAdamW
  _recursive_: true
  lr: 1e-4
  betas: [0.9, 0.95]
  weight_decay: 0.1
  weight_decay_module_blacklist:
    - _target_: hydra.utils.get_class
      path: torch.nn.Embedding
    - _target_: hydra.utils.get_class
      path: torch.nn.LayerNorm

lr_scheduler:
  interval: step
  scheduler:
    _target_: rmind.components.lr_schedulers.get_cosine_schedule_with_warmup
    num_warmup_steps: 4000
    num_training_steps: 77000


latent:
  _target_: rmind.components.route_latent.RouteWorldLatent
  # q_t = proj(z_q(waypoints_t)): the frozen waypoint tokenizer's latent (4 x 32 RVQ) asks the
  # current frame's DINO patches; E_t (64 tokens) is the route-guided evidence; W = the
  # factorized encoder over E (full within a timestep, causal across timesteps). No speed and
  # no actions enter the latent: speed is an INV target, actions are targets / FWD input.
  context_tokenizer:
    _target_: rmind.models.waypoints_tokenizer.WaypointsLatentTokenizer
    tokenizer:
      _target_: rmind.models.waypoints_tokenizer.WaypointsTokenizer.load_from_wandb_artifact
      artifact: yaak/waypoints-tokenizer/model-gzxgumtf:v9
      weights_only: false
  question_projection:
    _target_: rmind.components.nn.Linear
    in_features: 384  # waypoint tokenizer latent dim
    out_features: ${encoder_embedding_dim}
  key_norm:
    _target_: torch.nn.LayerNorm
    normalized_shape: ${image_embedding_dim}
  latent:
    _target_: rmind.components.transformer.CrossAttentionDecoderHead
    decoder:
      _target_: rmind.components.transformer.CrossAttentionDecoder
      dim_model: ${image_embedding_dim}
      num_layers: 8
      num_heads: 4
      attn_dropout: 0.1
      resid_dropout: 0.1
      mlp_dropout: 0.1
      hidden_layer_multiplier: 1
      self_attn: true
    final_norm:
      _target_: torch.nn.Identity
    output_projection:
      _target_: rmind.components.nn.Linear
      in_features: ${image_embedding_dim}
      out_features: ${image_embedding_dim}
  world:
    # factorized encoder over the per-step latents: full attention among the 64 tokens
    # within a timestep, causal attention across timesteps (per token, rotary time positions)
    _target_: rmind.components.transformer.TransformerEncoder
    dim_model: ${image_embedding_dim}
    num_layers: 16
    num_heads: 4
    attn_dropout: 0.1
    resid_dropout: 0.1
    mlp_dropout: 0.1
    hidden_layer_multiplier: 1
    final_norm:
      _target_: torch.nn.LayerNorm
      normalized_shape: ${image_embedding_dim}
    rope:
      _target_: rmind.components.position_encoding.RotaryPositionalEmbeddings
      dim:
        _target_: operator.floordiv
        _args_:
          - ${image_embedding_dim}
          - 4
      max_seq_len: 256
      base: 10

objectives:
  _target_: rmind.components.containers.ModuleDict
  _convert_: all
  modules:
    forward_dynamics:
      _target_: rmind.components.objectives.forward_dynamics.ForwardDynamicsObjective
      # (W_t, e_t) -> I(t+1): e_t = proj(z_q(codes of a_t)), the frozen per-step tokenizer,
      # fused channel-wise into every world token (K = V = Linear([W_t ; e_t]))
      action_tokenizer:
        _target_: rmind.models.action_tokenizer.ActionTokenizer.load_from_wandb_artifact
        artifact: yaak/rmind/model-m35hyvbp:v9
        weights_only: false
      action_codes: [input_tokens, joint_actions]
      action_projection:
        _target_: rmind.components.nn.Linear
        in_features: 384  # tokenizer codebook dim
        out_features: ${image_embedding_dim}
      # channel-wise: every world token k becomes Linear([W_t,k ; e_t]) (2d -> d)
      action_fusion:
        _target_: rmind.components.nn.Linear
        in_features: ${eval:'2 * ${image_embedding_dim}'}
        out_features: ${image_embedding_dim}
      # speed(t+1): a SEPARATE decoder (1 query) over the same K = V = Linear([W_t ; e_t]) as the
      # frame decoder, then Linear. Dynamics, so it lives in FWD (in INV it would bias INV to
      # motion); separate so the Gram loss does not dominate it.
      aux_query: speed
      aux_decoder:
        _target_: rmind.components.transformer.CrossAttentionDecoderHead
        decoder:
          _target_: rmind.components.transformer.CrossAttentionDecoder
          dim_model: ${encoder_embedding_dim}
          num_layers: 2
          num_heads: 4
          attn_dropout: 0.1
          resid_dropout: 0.1
          mlp_dropout: 0.1
          hidden_layer_multiplier: 1
          self_attn: false  # single query
        final_norm:
          _target_: torch.nn.LayerNorm
          normalized_shape: ${encoder_embedding_dim}
        output_projection:
          _target_: torch.nn.Identity
      aux_heads:
        _target_: rmind.components.containers.ModuleDict
        modules:
          continuous:
            speed:
              _target_: rmind.components.nn.Linear
              in_features: ${encoder_embedding_dim}
              out_features: ${speed_bins}
      aux_losses:
        _target_: rmind.components.containers.ModuleDict
        modules:
          continuous:
            speed:
              _target_: torch.nn.CrossEntropyLoss
      aux_targets:
        continuous:
          speed: [input_tokens, continuous, speed]  # speed(t+1), binned
      heads:
        _target_: rmind.components.containers.ModuleDict
        modules:
          summary:
            observation_summary:
              _target_: torch.nn.Identity
      losses:
        _target_: rmind.components.containers.ModuleDict
        modules:
          summary:
            observation_summary:
              _target_: rmind.components.loss.GramAnchoringLoss
              weight_sim: 1.0
              weight_gram: 100.0
              patches: 256
      targets:
        summary:
          observation_summary: [input_embeddings, image, cam_front_left]
      decoder:
        _target_: rmind.components.transformer.CrossAttentionDecoderHead
        decoder:
          _target_: rmind.components.transformer.CrossAttentionDecoder
          dim_model: ${image_embedding_dim}
          num_layers: 4
          num_heads: 4
          attn_dropout: 0.1
          resid_dropout: 0.1
          mlp_dropout: 0.1
          hidden_layer_multiplier: 1
          self_attn: true
        final_norm:
          _target_: torch.nn.Identity
        output_projection:
          _target_: rmind.components.nn.Linear
          in_features: ${image_embedding_dim}
          out_features: ${image_embedding_dim}
    inverse_dynamics:
      _target_: rmind.components.objectives.joint_inverse_dynamics.InverseDynamicsObjective
      value_norm:
        _target_: torch.nn.LayerNorm
        normalized_shape: ${encoder_embedding_dim}
      key_norm:  # LN the keys (=L) locally, since L is no longer LN'd at the latent head
        _target_: torch.nn.LayerNorm
        normalized_shape: ${encoder_embedding_dim}
      tokenizer:
        _target_: rmind.components.containers.ModuleDict
        modules:
          joint:
            actions:
              _target_: rmind.models.action_tokenizer.ActionTokenizer.load_from_wandb_artifact
              artifact: yaak/rmind/model-m35hyvbp:v9
              weights_only: false
      # INV reads only W(t+1): W is causal over time, so W(t+1) already attends to W(t)
      key_source: image  # key = value
      value_source: latent  # read W(t+1), not the raw frame I(t+1)
      decoder:
        _target_: rmind.components.transformer.CrossAttentionDecoderHead
        decoder:
          _target_: rmind.components.transformer.CrossAttentionDecoder
          dim_model: ${encoder_embedding_dim}
          num_layers: 4
          num_heads: 4
          attn_dropout: 0.1
          resid_dropout: 0.1
          mlp_dropout: 0.1
          hidden_layer_multiplier: 1
          self_attn: true
        final_norm:
          _target_: torch.nn.LayerNorm
          normalized_shape: ${encoder_embedding_dim}
        output_projection:
          _target_: torch.nn.Identity
      heads:
        _target_: rmind.components.containers.ModuleDict
        modules:
          joint:
            actions:
              _target_: rmind.components.nn.Linear
              in_features: ${encoder_embedding_dim}
              out_features: 64
      losses:
        _target_: rmind.components.containers.ModuleDict
        modules:
          joint:
            actions:
              _target_: rmind.components.loss.FocalLoss
      targets:
        joint:
          actions: [input_tokens, joint_actions]
    policy:
      _target_: rmind.components.objectives.joint_policy.PolicyObjective
      value_norm:
        _target_: torch.nn.LayerNorm
        normalized_shape: ${encoder_embedding_dim}
      key_norm:  # LN the keys (=L) locally, since L is no longer LN'd at the latent head
        _target_: torch.nn.LayerNorm
        normalized_shape: ${encoder_embedding_dim}
      # POLICY reads ONLY the last world latent W(T-1) (K = V = W). W carries the route
      # (via the question) and the scene, but no speed and no actions.
      latent_index: -1
      value_source: latent
      key_source: latent
      decoder:
        _target_: rmind.components.transformer.CrossAttentionDecoderHead
        decoder:
          _target_: rmind.components.transformer.CrossAttentionDecoder
          dim_model: ${encoder_embedding_dim}
          num_layers: 4
          num_heads: 4
          attn_dropout: 0.1
          resid_dropout: 0.1
          mlp_dropout: 0.1
          hidden_layer_multiplier: 1
          self_attn: true
        final_norm:
          _target_: torch.nn.LayerNorm
          normalized_shape: ${encoder_embedding_dim}
        output_projection:
          _target_: torch.nn.Identity
      # VQ-BeT over the frozen 6-step chunk tokenizer: predict codes + code-conditioned offset
      tokenizer:
        _target_: rmind.models.action_tokenizer.ActionTokenizer.load_from_wandb_artifact
        artifact: yaak/rmind/model-gkzgn6gk:v9
        weights_only: false
      code_head:  # (b, d) -> (b, g*c)
        _target_: torchvision.ops.MLP
        in_channels: ${encoder_embedding_dim}
        hidden_channels:
          - ${encoder_embedding_dim}
          - 64
      offset_head:  # (b, d) -> (b, g*c*action_dim), action_dim = action_space * action_clip
        _target_: torchvision.ops.MLP
        in_channels: ${encoder_embedding_dim}
        hidden_channels:
          - ${encoder_embedding_dim}
          - 1536
      losses:
        _target_: rmind.components.containers.ModuleDict
        modules:
          code:
            _target_: rmind.components.loss.FocalLoss
          offset:
            _target_: torch.nn.L1Loss
      chunk: [input, joint_actions_chunk]
