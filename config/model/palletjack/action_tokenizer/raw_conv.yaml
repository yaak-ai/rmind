---
# `raw.yaml` with a dilated temporal conv encoder/decoder instead of the MLP.
#
# WHY, after the DCT arms. `ChunkDCT` handed the MLP a better GLOBAL basis, and the
# lossless control (k=50, a pure rotation with nothing discarded) moved nothing:
# +0.918 against a1's +0.921. The basis was not the constraint.
#
# That leaves LOCAL temporal structure, which is a different claim. A convolution
# shares one kernel across every position, so it represents an edge wherever it falls;
# an MLP over a flattened 150-vector has to learn each position separately, and a fixed
# cosine basis has to spend many coefficients on any edge at all. This is why a codec
# built for sharp transients uses dilated residual convolutions (arXiv:2107.03312
# Fig. 3, dilations 1/3/9) rather than a dense layer.
#
# Fork is the axis to watch: it holds 15.7% of its power above 1 Hz but 49.3% of the
# error, and both DCT arms nudged it (+0.820/+0.822 against +0.813) while moving
# nothing else. Receptive field here is +/-16 of the 50 steps, ~3.3 s of the chunk.
_target_: rmind.models.action_tokenizer.ActionTokenizer
_recursive_: false
_convert_: all

input_transform:
  _target_: torch.nn.Sequential
  _convert_: all
  _args_:
    - _target_: rmind.components.nn.Remapper
      paths:
        continuous:
          traction: [data, traction]
          steering: [data, steering]
          fork1: [data, fork1]
    - _target_: rmind.components.containers.ModuleDict
      modules:
        continuous:
          _target_: rmind.components.nn.Identity

encoder:
  _target_: rmind.components.nn.ChunkConvEncoder
  num_steps: ${action_clip}
  num_axes: ${action_space}
  out_features: ${action_latent_dim}
  channels: ${conv_channels}
  dilations: [1, 3, 9]

quantizer:
  _target_: rmind.components.vq.ResidualVQ
  dim: ${action_latent_dim}
  codebook_size: ${codebook_size}
  num_quantizers: ${num_quantizers}

decoder:
  _target_: rmind.components.nn.ChunkConvDecoder
  num_steps: ${action_clip}
  num_axes: ${action_space}
  in_features: ${action_latent_dim}
  channels: ${conv_channels}
  dilations: [9, 3, 1]

targets:
  continuous:
    traction: [continuous, traction]
    steering: [continuous, steering]
    fork1: [continuous, fork1]

commitment_weight: 1.0
vq_weight: 5.0

optimizer:
  _target_: rmind.components.optimizers.SelectiveAdamW
  _recursive_: true
  lr: 5.5e-5
  betas: [0.9, 0.95]
  weight_decay: 0.1
  weight_decay_module_blacklist:
    - _target_: hydra.utils.get_class
      path: torch.nn.Embedding
    - _target_: hydra.utils.get_class
      path: torch.nn.LayerNorm

lr_scheduler:
  interval: step
  scheduler:
    _target_: rmind.components.lr_schedulers.get_cosine_schedule_with_warmup
    num_warmup_steps: ${lr_warmup_steps}
    num_training_steps: ${lr_total_steps}
