---
# `raw.yaml` with a wider, deeper encoder/decoder. Everything else identical.
#
# WHY. The 16x8 and 32x4 tokenizers both stop at holdout EV ~+0.85, and the cause is
# not the codebook: decoding the CONTINUOUS latent instead of its nearest codes only
# reaches +0.885, and both architectures land on that same ceiling. It is also not a
# generalization limit -- train EV (+0.843) equals holdout EV (+0.850), so the model
# cannot fit the data it was trained on. And it is not the metric: `smooth_l1_beta` is
# 1.0 while reconstruction errors run 0.04-0.4, so the loss never leaves its quadratic
# branch and is effectively MSE.
#
# The comparison that makes it concrete: a PCA basis fit on 12 TRAINING drives and
# scored on the same 395 holdout chunks reaches +0.909 at rank 16 and +0.968 at rank 32.
# A plain linear map of the same inputs beats the autoencoder. That is underfitting, so
# the fix is optimization and capacity, not more codes.
#
# `raw.yaml`'s encoder is Linear(150 -> 128) . GELU . Linear(128 -> 384): ONE hidden
# layer, and it is NARROWER than the 150-dim input. This adds a second hidden layer and
# takes the width from `action_hidden_dim` (set to 512 by the arm-2 experiment).
_target_: rmind.models.action_tokenizer.ActionTokenizer
_recursive_: false
_convert_: all

input_transform:
  _target_: torch.nn.Sequential
  _convert_: all
  _args_:
    - _target_: rmind.components.nn.Remapper
      paths:
        continuous:
          traction: [data, traction]
          steering: [data, steering]
          fork1: [data, fork1]
    - _target_: rmind.components.containers.ModuleDict
      modules:
        continuous:
          _target_: rmind.components.nn.Identity

encoder:
  _target_: torch.nn.Sequential
  _args_:
    - _target_: rmind.components.nn.Linear
      in_features: ${action_dim}
      out_features: ${action_hidden_dim}
    - _target_: torch.nn.GELU
    - _target_: rmind.components.nn.Linear
      in_features: ${action_hidden_dim}
      out_features: ${action_hidden_dim}
    - _target_: torch.nn.GELU
    - _target_: rmind.components.nn.Linear
      in_features: ${action_hidden_dim}
      out_features: ${action_latent_dim}

quantizer:
  _target_: rmind.components.vq.ResidualVQ
  dim: ${action_latent_dim}
  codebook_size: ${codebook_size}
  num_quantizers: ${num_quantizers}

decoder:
  _target_: torch.nn.Sequential
  _args_:
    - _target_: rmind.components.nn.Linear
      in_features: ${action_latent_dim}
      out_features: ${action_hidden_dim}
    - _target_: torch.nn.GELU
    - _target_: rmind.components.nn.Linear
      in_features: ${action_hidden_dim}
      out_features: ${action_hidden_dim}
    - _target_: torch.nn.GELU
    - _target_: rmind.components.nn.Linear
      in_features: ${action_hidden_dim}
      out_features: ${action_dim}

targets:
  continuous:
    traction: [continuous, traction]
    steering: [continuous, steering]
    fork1: [continuous, fork1]

commitment_weight: 1.0
vq_weight: 5.0

optimizer:
  _target_: rmind.components.optimizers.SelectiveAdamW
  _recursive_: true
  lr: 5.5e-5
  betas: [0.9, 0.95]
  weight_decay: 0.1
  weight_decay_module_blacklist:
    - _target_: hydra.utils.get_class
      path: torch.nn.Embedding
    - _target_: hydra.utils.get_class
      path: torch.nn.LayerNorm

lr_scheduler:
  interval: step
  scheduler:
    _target_: rmind.components.lr_schedulers.get_cosine_schedule_with_warmup
    num_warmup_steps: ${lr_warmup_steps}
    num_training_steps: ${lr_total_steps}
