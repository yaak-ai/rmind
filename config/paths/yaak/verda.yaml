---
# Verda cloud (FIN-01): the yaak dataset lives on the shared NFS volume
# `verda-nas` (mount: nfs.fin-01.datacrunch.io:/verda-nas-33cba3e6, ro,nolock).
# Layout mirrors /nasa/drives/yaak/data (drive dirs at the root).
data: /mnt/verda-nas
# NOTE: the Stage 1 labelling job (lfg_aux_supervision_results.md) only wrote to
# /nasa/drives/yaak/lfg_labels on the local host; this path is not yet populated on verda-nas.
# Sync before training with this arm on Verda -- and sync `v1` then re-run
# `scripts/lfg_required_frames.py link` there rather than copying the hardlink tree, since
# rsync without -H would expand 2.15M hardlinks into 2.15M real files.
lfg_labels: /mnt/verda-nas/lfg_labels/v1_nearest
rbyte:
  cache: .rbyte_cache
