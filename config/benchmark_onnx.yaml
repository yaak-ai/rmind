# @package _global_

---
defaults:
  - export: null
  - _self_

data_dir: ${oc.env:HOME}/data/Niro122-HQ/2023-05-25--09-34-14
start_frame: 2910
num_episodes: 50
frame_step: 10
output: /tmp/rmind.csv
warmup: 1
image_size: null
# "video" decodes cam_front_left.pii.mp4; "jpg" reads the pre-extracted
# frames/cam_front_left.pii.mp4/<W>x<H>/*.jpg instead (see /home/alex/data/
# dvc.yaml's extract_frames stage). "video_jpeg" decodes video like "video"
# but also round-trips the frame through ffmpeg's real mjpeg encoder at
# jpeg_qv= below, emulating that pipeline's JPEG-compression step (no
# scale_npp/CUDA needed for this, just `ffmpeg` on PATH — see
# _simulate_offline_jpeg in benchmark_onnx.py). Override e.g.
# frame_sources=[video,jpg,video_jpeg] to run every backend against all
# three and compare predictions side by side.
# "ffmpeg" re-runs the extract_frames ffmpeg command itself (NVDEC decode + GPU
# resize in NV12 + real mjpeg): 1.59 uint8 MAE vs the real training jpgs, where
# "video_jpeg" reaches 3.80 and "video" 4.42. Needs ffmpeg on PATH and (unless
# ffmpeg_hwaccel=false) a CUDA device.
# "torch_nv12" is the *deployable* path: the same NVDEC decode, but the resize
# and quantization done as GPU tensor ops by rmind.utils.frame_parity — which is
# what drivr runs on the car, where shelling out to ffmpeg per frame is not an
# option. It measures 1.13, i.e. BELOW the ffmpeg baseline, because its
# Catmull-Rom matches scale_npp (what training used) better than scale_cuda
# does. Include it alongside "ffmpeg" and "jpg" to see both.
frame_sources: [video]
# ffmpeg mjpeg -q:v (2..31, lower=better) used by the "video_jpeg" and
# "torch_nv12" sources —
# 16 matches the offline extraction pipeline's own `-q:v 16` and reproduces
# the real training jpgs' quantization tables byte-for-byte (asserted in
# tests/test_benchmark_onnx_preprocessing.py against real drive data). This is
# NOT a libjpeg 0-100 quality — see _simulate_offline_jpeg in
# benchmark_onnx.py for why no libjpeg quality value can express these tables.
jpeg_qv: 16
# "ffmpeg" source only: run extract_frames' real NVDEC decode + scale_cuda
# resize (in NV12, like scale_npp). Set false to fall back to a software resize,
# still in NV12 — measured 2.84 vs 1.59 uint8 MAE against the real training
# jpgs, so only use it where no CUDA device is available.
ffmpeg_hwaccel: true

# override per run, e.g.:
#   onnx=/path/to/model.onnx wandb_model=yaak/rmind/model-XXXXXXXX:vN
#   export=yaak/control_transformer/finetuned  # apples-to-apples vs the ONNX export
onnx: null
wandb_model: null
