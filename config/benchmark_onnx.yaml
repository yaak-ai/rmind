# @package _global_

---
defaults:
  - export: null
  - _self_

data_dir: ${oc.env:HOME}/data/Niro122-HQ/2023-05-25--09-34-14
start_frame: 2910
num_episodes: 50
frame_step: 10
output: /tmp/rmind.csv
warmup: 1
image_size: null
# "video" decodes cam_front_left.pii.mp4; "jpg" reads the pre-extracted
# frames/cam_front_left.pii.mp4/<W>x<H>/*.jpg instead (see /home/alex/data/
# dvc.yaml's extract_frames stage). Override to frame_sources=[video,jpg] to
# run every backend against both and compare predictions side by side.
frame_sources: [video]

# override per run, e.g.:
#   onnx=/path/to/model.onnx wandb_model=yaak/rmind/model-XXXXXXXX:vN
#   export=yaak/control_transformer/finetuned  # apples-to-apples vs the ONNX export
onnx: null
wandb_model: null
