# @package _global_
---
# Export the image-only palletjack policy to ONNX.
#
#   just export-onnx export=palletjack/control_transformer/policy \
#     model.checkpoint_path=/path/to/model.ckpt upload_to_wandb=false
#
# The exported graph takes a single input — a batch of 6 already-preprocessed
# frames — and returns the three actuation values for the last timestep:
#
#   in   cam_left_backward           float32 [1, 6, 3, 256, 256]
#   out  policy.continuous.traction  float32 [1, 1]
#   out  policy.continuous.steering  float32 [1, 1]
#   out  policy.continuous.fork1      float32 [1, 1]
#
# `hparams_jq` strips everything the kit does not provide: the per-modality input
# transform (so the caller owns crop/resize/normalize, as in the yaak pipeline)
# and the action inputs (targets and losses only exist for training).
model:
  _target_: rmind.models.control_transformer.ControlTransformer.load_from_checkpoint
  checkpoint_path: ???
  map_location: cpu
  strict: false
  hparams_jq: |
    delpaths([
      ["objectives", "modules", "policy", "losses"],
      ["objectives", "modules", "policy", "targets"],
      ["episode_builder", "input_transform", "_args_", 1],
      ["episode_builder", "input_transform", "_args_", 0, "paths", "continuous"],
      ["episode_builder", "tokenizers", "modules", "continuous"],
      ["episode_builder", "embeddings", "modules", "continuous"],
      ["episode_builder", "projections", "modules", "continuous"]
    ])

input:
  data:
    cam_left_backward:
      _target_: torch.testing.make_tensor
      _args_: [1, 6, 3, 256, 256]
      dtype:
        _target_: hydra.utils.get_object
        path: torch.float
      device: cpu
      low: -3
      high: 3

input_names:
  - cam_left_backward
