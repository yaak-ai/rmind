# @package _global_
---
# Export the patch-policy palletjack policy to ONNX.
#
#   just export-onnx export=palletjack/patch_policy/policy \
#     "model.checkpoint_path='/path/to/model.ckpt'" upload_to_wandb=false
#
#   in   cam_left_backward           float32 [1, 6, 3, 256, 256]
#   in   speed                       float32 [1, 6, 1]
#   out  policy.continuous.traction  float32 [1, 1]
#   out  policy.continuous.steering  float32 [1, 1]
#   out  policy.continuous.fork1     float32 [1, 1]
#
# Output names match the control-transformer export exactly, so the kit's output
# binding is unchanged. `speed` is the one addition: this trunk prepends a speed
# token to every frame block. It is constant 0 in the card rig (no speed source
# yet), so feeding zeros reproduces training.
#
# `load_for_export` swaps the in-model image pipeline for Identity, so the
# caller owns crop/resize/normalize exactly as with the control-transformer
# graph. The action fields resolve to None at inference; they are targets only.
model:
  _target_: rmind.models.patch_policy_continuous.PatchPolicyContinuous.load_for_export
  checkpoint_path: ???

input:
  data:
    cam_left_backward:
      _target_: torch.testing.make_tensor
      _args_: [1, 6, 3, 256, 256]
      dtype:
        _target_: hydra.utils.get_object
        path: torch.float
      device: cpu
      low: -3
      high: 3

    speed:
      _target_: torch.testing.make_tensor
      _args_: [1, 6, 1]
      dtype:
        _target_: hydra.utils.get_object
        path: torch.float32
      device: cpu
      low: 0
      high: 0

input_names:
  - cam_left_backward
  - speed
