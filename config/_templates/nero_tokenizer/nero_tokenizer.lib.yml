#@ }

#@ def tokenizer(name):
#@   t = tokenizers[name]
nero_ckpt_root: #@ "${oc.env:NERO_CKPT_ROOT," + nas_ckpt + "}"
tokenizer_ckpt: #@ "${nero_ckpt_root}/" + t["path"]
tokenizer_ckpt_sha256: #@ t["sha256"]
#@ end
