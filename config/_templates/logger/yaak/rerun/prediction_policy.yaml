#@yaml/text-templated-strings
---
_target_: rbyte.viz.loggers.RerunLogger
_convert_: all
_recursive_: false
application_id: prediction_policy
recording_name: [batch, meta, input_id]
schema:
  batch/cam_front_left/time_stamp:
    _target_: rerun.TimeColumn
    timestamp: [batch, data, meta/ImageMetadata.cam_front_left/time_stamp]
    dtype: datetime64[us]

  batch/cam_front_left/frame_idx:
    _target_: rerun.TimeColumn
    sequence: [batch, data, meta/ImageMetadata.cam_front_left/frame_idx]

  batch/cam_front_left:
    - _target_: rerun.Image.columns
      buffer: [batch, data, cam_front_left]

    - static: true
      _target_: rerun.Image.from_fields
      format:
        _target_: rerun.components.ImageFormat
        height: 324
        width: 576
        color_model: RGB
        channel_datatype: u8

  #@ for key in [
  #@     "meta/VehicleMotion/brake_pedal_normalized",
  #@     "meta/VehicleMotion/gas_pedal_normalized",
  #@     "meta/VehicleMotion/steering_angle_normalized",
  #@     "meta/VehicleState/turn_signal",
  #@ ]:
  batch/(@=key@):
    - _target_: rerun.Scalars.columns
      scalars: [batch, data, (@=key@)]

    - static: true
      _target_: rerun.SeriesLines
  #@ end

  #@ predictions = {
  #@     "policy": {
  #@         # discrete/turn_signal deliberately omitted: not every policy
  #@         # checkpoint has a turn_signal head (e.g. one pretrained without
  #@         # it), and rbyte's RerunLogger has no graceful-missing-key
  #@         # fallback -- it hard KeyErrors on the first absent path, taking
  #@         # every other panel down with it. turn_signal ground truth/
  #@         # predictions still land in the prediction parquet (DataFramePredictionWriter
  #@         # selects the whole "value" subtree), just not live-plotted here.
  #@         k: {"continuous": ["gas_pedal", "brake_pedal", "steering_angle"]}
  #@         for k in [
  #@             "ground_truth",
  #@             "prediction_value",
  #@             "score_l1",
  #@             "score_logprob",
  #@             "score_signed_error",
  #@             "ground_truth_diff_prev",
  #@             "prediction_diff_prev",
  #@             "ground_truth_diff_hist",
  #@             "prediction_diff_hist",
  #@             "score_l1_rel",
  #@         ]
  #@     },
  #@ }
  #@ for key_objective, data_objective in predictions.items():
  #@  for key_prediction, data_prediction in data_objective.items():
  #@    for modality, keys in data_prediction.items():
  #@      for key in keys:
  (@=key_objective@)/(@=key_prediction@)/(@=modality@)/(@=key@):
    - _target_: rerun.Scalars.columns
      scalars: [(@=key_objective@), (@=key_prediction@), value, (@=modality@), (@=key@)]
      indices: [(@=key_objective@), (@=key_prediction@), timestep_indices]

    - static: true
      _target_: rerun.SeriesLines
      names: (@=key_prediction@)/(@=key@)
  #@      end
  #@    end
  #@  end
  #@ end

  #@ # trajectory_value/trajectory_gt's "xy_path" is always a directly-plottable
  #@ # local-frame path (points already composed into the shared reference
  #@ # frame -- see PolicyObjective.predict()/compose_relative_trajectory),
  #@ # unlike its "xy"/"yaw" siblings, which are raw per-step chain deltas
  #@ # when trajectory_target="relative". All points of one window's path
  #@ # share that window's reference-tick timestamp, so each shows up as one
  #@ # fan of points at that moment on the timeline, not spread across it.
  #@ trajectory_points = {
  #@     "trajectory_value": {"color": [160, 32, 200], "radii": 0.05},
  #@     "trajectory_gt": {"color": [32, 180, 90], "radii": 0.08},
  #@ }
  #@ for key_prediction, style in trajectory_points.items():
  policy/(@=key_prediction@)/path:
    - _target_: rerun.Points2D.columns
      positions: [policy, (@=key_prediction@), value, xy_path]
      indices: [policy, (@=key_prediction@), timestep_indices]

    - static: true
      _target_: rerun.Points2D.from_fields
      colors: #@ style["color"]
      radii: #@ style["radii"]
  #@ end

  #@ # route waypoints at the reference tick, already sliced from the raw
  #@ # per-tick (b, 6, 10, 2) batch field and rescaled to meters by
  #@ # RerunPredictionWriter's route_key/route_tick/route_scale (config-level,
  #@ # since episode.get() can't see raw batch fields a checkpoint's own
  #@ # episode_builder wasn't configured to remap -- see PolicyObjective's
  #@ # raw_waypoints_key docstring). Shares trajectory_gt's reference-tick
  #@ # timestamp so it lines up with trajectory_value/trajectory_gt.
  batch/route_local:
    - _target_: rerun.Points2D.columns
      positions: [batch, data, route_local]
      indices: [policy, trajectory_gt, timestep_indices]

    - static: true
      _target_: rerun.Points2D.from_fields
      colors: [230, 140, 20]
      radii: 0.03
