---
_target_: rbyte.Dataset.from_config
_recursive_: false
_convert_: all
streams:
  cam_front_left:
    index: meta/ImageMetadata.cam_front_left/frame_idx
    sources:
      drive:
        _target_: rbyte.io.PathTensorSource
        path: "${drive_dir}/frames/cam_front_left.pii.mp4/576x324/{:09d}.jpg"
        decoder:
          _target_: simplejpeg.decode_jpeg
          _partial_: true
          colorspace: rgb
          fastdct: true
          fastupsample: true

samples:
  inputs:
    input_id:
      - drive

    yaak_metadata_path:
      - ${drive_dir}/metadata.log

    waypoints_path:
      - ${drive_dir}/waypoints.json

    headings_denoised_path:
      - ${drive_dir}/headings_denoised.json

    cam_front_left_path:
      - ${drive_dir}/frames/cam_front_left.pii.mp4/576x324

  executor:
    _target_: concurrent.futures.ProcessPoolExecutor
    mp_context:
      _target_: multiprocessing.get_context
      method: forkserver

  storage: file_array
  run_folder: ${paths.rbyte.cache}/yaak/predict_drive/samples
  scheduling_strategy: eager
  return_results: false
  persist_memory: false

  pipeline:
    _target_: pipefunc.Pipeline
    validate_type_annotations: false
    cache_type: disk
    cache_kwargs:
      cache_dir: ${paths.rbyte.cache}
    functions:
      - _target_: pipefunc.PipeFunc
        renames:
          path: yaak_metadata_path
        output_name: meta
        mapspec: "yaak_metadata_path[i] -> meta[i]"
        cache: true
        func:
          _target_: rbyte.io.YaakMetadataDataFrameBuilder
          fields:
            rbyte.io.yaak.proto.sensor_pb2.ImageMetadata:
              time_stamp:
                _target_: polars.Datetime
                time_unit: us
              frame_idx:
                _target_: polars.Int32
              camera_name:
                _target_: polars.Enum
                categories:
                  - cam_front_center
                  - cam_front_left
                  - cam_front_right
                  - cam_left_forward
                  - cam_right_forward
                  - cam_left_backward
                  - cam_right_backward
                  - cam_rear

            rbyte.io.yaak.proto.can_pb2.VehicleState:
              time_stamp:
                _target_: polars.Datetime
                time_unit: us
              turn_signal:
                _target_: polars.Int8

            rbyte.io.yaak.proto.can_pb2.VehicleMotion:
              time_stamp:
                _target_: polars.Datetime
                time_unit: us
              speed:
                _target_: polars.Float32
              gas_pedal_normalized:
                _target_: polars.Float32
              brake_pedal_normalized:
                _target_: polars.Float32
              steering_angle_normalized:
                _target_: polars.Float32
              gear:
                _target_: polars.Enum
                categories: ["0", "1", "2", "3"]

            rbyte.io.yaak.proto.sensor_pb2.Gnss:
              time_stamp:
                _target_: polars.Datetime
                time_unit: us
              latitude:
                _target_: polars.Float32
              longitude:
                _target_: polars.Float32

      - _target_: pipefunc.PipeFunc
        output_name: waypoints_raw
        mapspec: "waypoints_path[i] -> waypoints_raw[i]"
        func:
          _target_: makefun.create_function
          func_signature: "build_waypoints(*, waypoints_path)"
          func_impl:
            _target_: rbyte.io.DuckDBDataFrameQuery
            extensions: [spatial]
            config:
              TimeZone: UTC
            query: |
              SELECT TO_TIMESTAMP(timestamp)::TIMESTAMP AS timestamp,
                     ST_AsWKB(ST_Transform(geom, 'EPSG:4326', 'EPSG:25832', always_xy := true)) AS geometry
              FROM ST_Read($waypoints_path)

      - _target_: pipefunc.PipeFunc
        renames:
          input: waypoints_raw
        output_name: waypoints
        mapspec: "waypoints_raw[i] -> waypoints[i]"
        func:
          _target_: rbyte.io.WaypointBuilder
          length: 91
          columns:
            points: geometry
            output: xy

      - _target_: pipefunc.PipeFunc
        output_name: headings_denoised
        mapspec: "headings_denoised_path[i] -> headings_denoised[i]"
        cache: true
        func:
          _target_: makefun.create_function
          func_signature: "build_headings_denoised(*, headings_denoised_path)"
          func_impl:
            _target_: rbyte.io.DuckDBDataFrameQuery
            query: |
              SELECT make_timestamp(h.timestamp_us) AS timestamp, h.heading
              FROM (SELECT unnest(headings) AS h FROM read_json_auto($headings_denoised_path))

      - _target_: pipefunc.PipeFunc
        output_name: aligned
        mapspec: "meta[i], waypoints[i], headings_denoised[i] -> aligned[i]"
        func:
          _target_: makefun.create_function
          func_signature: "align(*, meta, waypoints, headings_denoised)"
          func_impl:
            _target_: rbyte.io.DataFrameAligner
            separator: /
            fields:
              meta:
                ImageMetadata.cam_front_left:
                  key: time_stamp

                VehicleState:
                  key: time_stamp
                  columns:
                    turn_signal:
                      method: asof
                      tolerance: 100ms

                VehicleMotion:
                  key: time_stamp
                  columns:
                    speed:
                      method: interp
                    gas_pedal_normalized:
                      method: interp
                    brake_pedal_normalized:
                      method: interp
                    steering_angle_normalized:
                      method: interp
                    gear:
                      method: asof
                      tolerance: 100ms
                      strategy: nearest

                Gnss:
                  key: time_stamp
                  columns:
                    latitude:
                      method: asof
                      tolerance: 500ms
                      strategy: nearest
                    longitude:
                      method: asof
                      tolerance: 500ms
                      strategy: nearest

              waypoints:
                key: timestamp
                columns:
                  xy:
                    method: asof
                    strategy: forward

              headings_denoised:
                key: timestamp
                columns:
                  heading:
                    method: asof
                    strategy: nearest

      - _target_: pipefunc.PipeFunc
        renames:
          path: cam_front_left_path
        output_name: cam_front_left_meta
        mapspec: "cam_front_left_path[i] -> cam_front_left_meta[i]"
        cache: true
        func:
          _target_: rbyte.io.PathDataFrameBuilder
          pattern: (?<frame_idx>\d+).jpg
          fields:
            frame_idx:
              _target_: polars.Int32

      - _target_: pipefunc.PipeFunc
        output_name: filtered
        mapspec: "aligned[i], cam_front_left_meta[i] -> filtered[i]"
        func:
          _target_: makefun.create_function
          func_signature: "filter(*, aligned, cam_front_left_meta)"
          func_impl:
            _target_: rbyte.io.DuckDBDataFrameQuery
            extensions: [spatial]
            query: |
              WITH
                base_data AS (
                  SELECT
                    *,
                    ST_Transform(
                      ST_Point("meta/Gnss/longitude", "meta/Gnss/latitude"),
                      'EPSG:4326', 'EPSG:25832', always_xy := true
                    ) AS ego_geom,
                    ST_GeomFromWKB("waypoints/xy") AS waypoints_geom
                  FROM
                    aligned
                    SEMI JOIN cam_front_left_meta
                    ON aligned."meta/ImageMetadata.cam_front_left/frame_idx"
                    = cam_front_left_meta.frame_idx
                  WHERE
                    COLUMNS(*) IS NOT NULL
                ),
                normalized_geometries AS (
                  SELECT
                    *,
                    ST_Rotate(
                      ST_Translate(
                        waypoints_geom,
                        - ST_X(ego_geom),
                        - ST_Y(ego_geom)
                      ),
                      radians("headings_denoised/heading")
                    ) AS normalized_waypoints_geom
                  FROM
                    base_data
                )
              SELECT
                * EXCLUDE (
                  "meta/VehicleMotion/gear",
                  waypoints_geom,
                  normalized_waypoints_geom,
                  ego_geom,
                  "waypoints/xy",
                  "headings_denoised/heading"
                ),
                [
                  ST_X(ego_geom),
                  ST_Y(ego_geom)
                ] AS "meta/Gnss/xy",
                  (
                  SELECT
                    list(
                      [ST_X(p.point_struct.geom), ST_Y(p.point_struct.geom)]
                      ORDER BY
                        p.point_struct.path
                    )
                  FROM
                    UNNEST(ST_Dump(waypoints_geom)) AS p(point_struct)
                  WHERE (p.point_struct.path[1] - 1) % 10 = 0
                ) AS "waypoints/xy",
                (
                  SELECT
                    list(
                      [ST_X(p.point_struct.geom) / 100, ST_Y(p.point_struct.geom) / 100]
                      ORDER BY
                        p.point_struct.path
                    )
                  FROM
                    UNNEST(ST_Dump(normalized_waypoints_geom)) AS p(point_struct)
                  WHERE (p.point_struct.path[1] - 1) % 10 = 0
                ) AS "waypoints/xy_normalized"
              FROM
                normalized_geometries
              ORDER BY
                "meta/ImageMetadata.cam_front_left/time_stamp";

      - _target_: pipefunc.PipeFunc
        renames:
          input: filtered
        output_name: samples
        mapspec: "filtered[i] -> samples[i]"
        func:
          _target_: rbyte.io.DataFrameGroupByDynamic
          index_column: meta/ImageMetadata.cam_front_left/frame_idx
          every: 10i
          period: 70i
          closed: left
          gather_every: 10

      - _target_: pipefunc.PipeFunc
        output_name: samples_cast
        mapspec: "samples[i] -> samples_cast[i]"
        func:
          _target_: makefun.create_function
          func_signature: "cast(*, samples)"
          func_impl:
            _target_: rbyte.io.DuckDBDataFrameQuery
            query: |
              SELECT
                  "meta/ImageMetadata.cam_front_left/time_stamp"::TIMESTAMP[7] AS "meta/ImageMetadata.cam_front_left/time_stamp",
                  "meta/ImageMetadata.cam_front_left/frame_idx"::INT32[7] AS "meta/ImageMetadata.cam_front_left/frame_idx",
                  "meta/VehicleMotion/speed"::FLOAT[7] AS "meta/VehicleMotion/speed",
                  "meta/VehicleMotion/gas_pedal_normalized"::FLOAT[7] AS "meta/VehicleMotion/gas_pedal_normalized",
                  "meta/VehicleMotion/brake_pedal_normalized"::FLOAT[7] AS "meta/VehicleMotion/brake_pedal_normalized",
                  "meta/VehicleMotion/steering_angle_normalized"::FLOAT[7] AS "meta/VehicleMotion/steering_angle_normalized",
                  "meta/VehicleState/turn_signal"::INT8[7] AS "meta/VehicleState/turn_signal",
                  "meta/Gnss/xy"::FLOAT[2][7] AS "meta/Gnss/xy",
                  "waypoints/xy_normalized"::FLOAT[2][10][7] AS "waypoints/xy_normalized",
                  "waypoints/xy"::FLOAT[2][10][7] AS "waypoints/xy",
              FROM
                  samples
              WHERE
                  len("meta/ImageMetadata.cam_front_left/frame_idx") = 7
                  AND list_last("meta/ImageMetadata.cam_front_left/frame_idx") - list_first("meta/ImageMetadata.cam_front_left/frame_idx") == 60

      - _target_: pipefunc.PipeFunc
        renames:
          keys: input_id
          values: samples_cast
        output_name: samples_aggregated
        func:
          _target_: rbyte.io.DataFrameConcater
          key_column: input_id
