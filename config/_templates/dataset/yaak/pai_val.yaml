---
_target_: rbyte.Dataset.from_config
_recursive_: false
_convert_: all
streams:
  cam_front_left:
    index: meta/ImageMetadata.cam_front_left/frame_idx
    sources:
      #@ for/end clip_id in clips:
      (@=clip_id@):
        _target_: rmind.io.ConcurrentPathTensorSource
        path: "${paths.pai_data}/clips/(@=clip_id@)/frames/cam_front_left/576x324/{:09d}.jpg"
        decoder:
          _target_: simplejpeg.decode_jpeg
          _partial_: true
          colorspace: rgb
          fastdct: true
          fastupsample: true

samples:
  inputs:
    input_id:
      #@ for/end clip_id in clips:
      - (@=clip_id@)

    meta_path:
      #@ for/end clip_id in clips:
      - ${paths.pai_data}/clips/(@=clip_id@)/meta.parquet

    cam_front_left_path:
      #@ for/end clip_id in clips:
      - ${paths.pai_data}/clips/(@=clip_id@)/frames/cam_front_left/576x324

  executor:
    _target_: concurrent.futures.ProcessPoolExecutor
    mp_context:
      _target_: multiprocessing.get_context
      method: forkserver

  storage: file_array
  run_folder: "${paths.rbyte.cache}/pai/val/clip${clip_length}/stride${oc.select:val_episode_stride,${episode_stride}}-off0/samples"
  scheduling_strategy: eager
  return_results: false
  persist_memory: false

  pipeline:
    _target_: pipefunc.Pipeline
    validate_type_annotations: false
    cache_type: disk
    cache_kwargs:
      cache_dir: ${paths.rbyte.cache}
    functions:
      - _target_: pipefunc.PipeFunc
        output_name: meta
        mapspec: "meta_path[i] -> meta[i]"
        func:
          _target_: makefun.create_function
          func_signature: "build_meta(*, meta_path)"
          func_impl:
            _target_: rbyte.io.DuckDBDataFrameQuery
            query: |
              SELECT * FROM read_parquet($meta_path)

      - _target_: pipefunc.PipeFunc
        renames:
          path: cam_front_left_path
        output_name: cam_front_left_meta
        mapspec: "cam_front_left_path[i] -> cam_front_left_meta[i]"
        cache: true
        func:
          _target_: rbyte.io.PathDataFrameBuilder
          pattern: (?<frame_idx>\d+).jpg
          fields:
            frame_idx:
              _target_: polars.Int32

      # meta.parquet already carries the yaak column names and conventions
      # (rmind.scripts.pai_convert): only filter, drop the converter's own
      # column, and apply the same clip-grid phase shift as the yaak train set.
      - _target_: pipefunc.PipeFunc
        output_name: filtered
        mapspec: "meta[i], cam_front_left_meta[i] -> filtered[i]"
        func:
          _target_: makefun.create_function
          func_signature: "filter(*, meta, cam_front_left_meta)"
          func_impl:
            _target_: rbyte.io.DuckDBDataFrameQuery
            query: |
              WITH
                clip_grid AS (
                  SELECT
                    * EXCLUDE ("pai/waypoints_extrapolated_m")
                  FROM
                    meta
                    SEMI JOIN cam_front_left_meta
                    ON meta."meta/ImageMetadata.cam_front_left/frame_idx"
                    = cam_front_left_meta.frame_idx
                  WHERE
                    meta."meta/VehicleMotion/speed" BETWEEN 0.0 AND 130.0
                    -- waypoints past the last egomotion pose are a straight
                    -- extension, not the driven route
                    AND meta."pai/waypoints_extrapolated_m" <= ${oc.select:pai_max_extrapolated_m,30.0}
                    AND COLUMNS(*) IS NOT NULL
                )
              SELECT
                *
              FROM
                clip_grid
              WHERE
                "meta/ImageMetadata.cam_front_left/frame_idx" >= (
                  SELECT
                    MIN("meta/ImageMetadata.cam_front_left/frame_idx") + 0
                  FROM
                    clip_grid
                )
              ORDER BY
                "meta/ImageMetadata.cam_front_left/time_stamp";

      - _target_: pipefunc.PipeFunc
        renames:
          input: filtered
        output_name: samples
        mapspec: "filtered[i] -> samples[i]"
        func:
          _target_: rbyte.io.DataFrameGroupByDynamic
          index_column: meta/ImageMetadata.cam_front_left/frame_idx
          every: "${oc.select:val_episode_stride,${episode_stride}}i"
          period: ${clip_period}
          closed: left
          gather_every: ${episode_step}

      - _target_: pipefunc.PipeFunc
        output_name: samples_cast
        mapspec: "samples[i] -> samples_cast[i]"
        func:
          _target_: makefun.create_function
          func_signature: "cast(*, samples)"
          func_impl:
            _target_: rbyte.io.DuckDBDataFrameQuery
            query: |
              SELECT
                  "meta/ImageMetadata.cam_front_left/time_stamp"[1:${clip_length}]::TIMESTAMP[${clip_length}] AS "meta/ImageMetadata.cam_front_left/time_stamp",
                  "meta/ImageMetadata.cam_front_left/frame_idx"[1:${clip_length}]::INT32[${clip_length}] AS "meta/ImageMetadata.cam_front_left/frame_idx",
                  "meta/VehicleMotion/speed"[1:${clip_length}]::FLOAT[${clip_length}] AS "meta/VehicleMotion/speed",
                  "headings_denoised/heading"[1:${clip_length}]::FLOAT[${clip_length}] AS "headings_denoised/heading",
                  "meta/Gnss/xy"[1:${clip_length}]::FLOAT[2][${clip_length}] AS "meta/Gnss/xy",
                  "waypoints/xy_normalized"[1:${clip_length}]::FLOAT[2][10][${clip_length}] AS "waypoints/xy_normalized",
                  "waypoints/xy"[1:${clip_length}]::FLOAT[2][10][${clip_length}] AS "waypoints/xy",
                  "meta/VehicleMotion/gas_pedal_normalized"[1:${clip_length}]::FLOAT[${clip_length}] AS "meta/VehicleMotion/gas_pedal_normalized",
                  "meta/VehicleMotion/brake_pedal_normalized"[1:${clip_length}]::FLOAT[${clip_length}] AS "meta/VehicleMotion/brake_pedal_normalized",
                  "meta/VehicleMotion/steering_angle_normalized"[1:${clip_length}]::FLOAT[${clip_length}] AS "meta/VehicleMotion/steering_angle_normalized",
                  "meta/VehicleState/turn_signal"[1:${clip_length}]::BIGINT[${clip_length}] AS "meta/VehicleState/turn_signal",
              FROM
                  samples
              WHERE
                  len("meta/ImageMetadata.cam_front_left/frame_idx") = ${clip_length}
                  AND list_last("meta/ImageMetadata.cam_front_left/frame_idx") - list_first("meta/ImageMetadata.cam_front_left/frame_idx") == (${clip_length} - 1) * ${episode_step}
                  -- strictly positive, bounded steps (same guard as the yaak sets)
                  AND len(list_filter(
                      list_transform(
                          list_zip(
                              "meta/ImageMetadata.cam_front_left/time_stamp",
                              "meta/ImageMetadata.cam_front_left/time_stamp"[2:]
                          ),
                          x -> date_diff('millisecond', x[1], x[2])
                      ),
                      dt -> dt <= 0 OR dt > ${oc.select:max_frame_gap_ms,1000}
                  )) = 0

      - _target_: pipefunc.PipeFunc
        renames:
          keys: input_id
          values: samples_cast
        output_name: samples_aggregated
        func:
          _target_: rbyte.io.DataFrameConcater
          key_column: input_id

      - _target_: pipefunc.PipeFunc
        output_name: samples_with_id
        renames:
          self: samples_aggregated
        func:
          _target_: polars.DataFrame.with_row_index
          _partial_: true
          name: meta/sample_id
