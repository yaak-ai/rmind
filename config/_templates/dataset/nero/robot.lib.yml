#@ # rbyte dataset for nero ROBOT-NATIVE episodes (nutron-cli record.py takes).
#@ # One episode == one directory under ${nero_robot_dir} with data.mcap,
#@ # base/side_left/side_right.mp4 and outcome.json.
#@ #
#@ # Pipeline: NeroRobotReader (convert.py rules, robot-native
#@ # state/action, 100-step hold-padded chunks, hand token blocks via the
#@ # vendored hand_features) -> semi-join on the frames each mp4 really has ->
#@ # NeroRobotWindowGrouper (T frames on the 10 Hz grid, every gathered frame
#@ # 3 apart in a COMPLETE 30 Hz run; window starts every episode_stride, coprime
#@ # to 3 so all 30 Hz phases are used).
#@ #
#@ # Images are decoded at NATIVE resolution and mapped to the model grid by
#@ # rmind.data.nero_image.preprocess -- the function serving calls (P10). No
#@ # decoder-side (swscale) resize anywhere on this path.

#@ # FRAME CACHE (opt-in, `frame_cache=True`): the image streams read
#@ # `${nero_frame_cache}/<take>/<camera>.npy`, every mp4 frame already through
#@ # `preprocess` (rmind.data.nero_frame_cache; build it with
#@ # `python -m rmind.scripts.nero_frame_cache`). Byte-identical inputs, no decode
#@ # in the loop; the source refuses a stale or unfinished cache. The samples
#@ # pipeline below is the same either way.

#@ cameras = ["base", "side_left", "side_right"]

#@ def dataset(episodes, split, frame_cache=False):
_target_: rbyte.Dataset.from_config
_recursive_: false
_convert_: all
streams:
  #@ for camera in cameras:
  #@yaml/text-templated-strings
  image.(@=camera@):
    index: #@ "frame_index." + camera
    sources:
      #@ for episode in episodes:
      #@ if frame_cache:
      #@yaml/text-templated-strings
      (@=episode@):
        _target_: rmind.data.nero_frame_cache.NeroFrameCacheSource
        path: #@ "${nero_frame_cache}/" + episode + "/" + camera + ".npy"
        video: #@ "${nero_robot_dir}/" + episode + "/" + camera + ".mp4"
        input_hw: ["${image_height}", "${image_width}"]
      #@ else:
      #@yaml/text-templated-strings
      (@=episode@):
        _target_: rbyte.streams.transformed.TransformedSource
        source:
          _target_: rbyte.streams.video.TorchCodecVideoSource
          source: #@ "${nero_robot_dir}/" + episode + "/" + camera + ".mp4"
          #! native 1080p/800p decode is the data-loading bottleneck (measured
          #! ~4.6 s per 2 x 32-frame batch single-threaded): give ffmpeg threads
          num_ffmpeg_threads: "${oc.select:nero_decode_threads,4}"
        transform:
          _target_: rmind.data.nero_image.NeroImagePreprocess
          input_hw: ["${image_height}", "${image_width}"]
      #@ end
      #@ end
  #@ end

samples:
  inputs:
    input_id: #@ episodes
    mcap_path: #@ ["${nero_robot_dir}/" + e + "/data.mcap" for e in episodes]
    #@ for camera in cameras:
    #@yaml/text-templated-strings
    (@=camera@)_path: #@ ["${nero_robot_dir}/" + e + "/" + camera + ".mp4" for e in episodes]
    #@ end

  executor:
    _target_: concurrent.futures.ProcessPoolExecutor
    max_workers: 2
    mp_context:
      _target_: multiprocessing.get_context
      method: forkserver

  pipeline:
    _target_: pipefunc.Pipeline
    validate_type_annotations: false
    functions:
      - _target_: pipefunc.PipeFunc
        renames:
          path: mcap_path
        output_name: nero
        mapspec: "mcap_path[i] -> nero[i]"
        func:
          _target_: rbyte.samples.nero.NeroRobotReader
          chunk_size: ${chunk_size}

      #@ for camera in cameras:
      - _target_: pipefunc.PipeFunc
        renames:
          path: #@ camera + "_path"
        output_name: #@ camera + "_meta"
        mapspec: #@ camera + "_path[i] -> " + camera + "_meta[i]"
        func:
          _target_: rbyte.samples.video.VideoFrameIndexer
          fields:
            frame_idx:
              _target_: polars.Int32
      #@ end

      - _target_: pipefunc.PipeFunc
        output_name: filtered
        mapspec: "nero[i], base_meta[i], side_left_meta[i], side_right_meta[i] -> filtered[i]"
        func:
          _target_: makefun.create_function
          func_signature: "filter(*, nero, base_meta, side_left_meta, side_right_meta)"
          func_impl:
            _target_: rbyte.samples.duckdb.DuckDBQuery
            query: |
              SELECT *
              FROM
                nero
                SEMI JOIN base_meta
                  ON nero."frame_index.base" = base_meta.frame_idx
                SEMI JOIN side_left_meta
                  ON nero."frame_index.side_left" = side_left_meta.frame_idx
                SEMI JOIN side_right_meta
                  ON nero."frame_index.side_right" = side_right_meta.frame_idx
              ORDER BY nero."grid_index"

      - _target_: pipefunc.PipeFunc
        renames:
          input: filtered
        output_name: samples
        mapspec: "filtered[i] -> samples[i]"
        func:
          _target_: rbyte.samples.nero.NeroRobotWindowGrouper
          clip_frames: ${episode_length}
          frame_stride: ${frame_stride}
          episode_stride: ${episode_stride}
          episode_offset: ${episode_offset}

      - _target_: pipefunc.PipeFunc
        renames:
          keys: input_id
          values: samples
        output_name: samples_aggregated
        func:
          _target_: rbyte.samples.dataframe.DataFrameConcatenator
          key_column: input_id
#@ end
