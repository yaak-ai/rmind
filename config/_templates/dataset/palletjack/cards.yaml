---
# Synthetic "command card" dataset — see `rmind.scripts.generate_cards`.
# Every episode is `episode_length` copies of a single card frame plus that
# card's constant action, so the only thing the model can learn is
# card image -> action. Used to smoke-test the kit inference pipeline.
_target_: rbyte.Dataset.from_config
_recursive_: false
_convert_: all
streams:
  cam_left_backward:
    index: frame_idx
    sources:
      cards:
        _target_: rbyte.streams.path.PathSource
        path: "${paths.cards}/frames/{:06d}.jpg"
        decoder:
          _target_: simplejpeg.decode_jpeg
          _partial_: true
          colorspace: rgb
          fastdct: true
          fastupsample: true

samples:
  inputs:
    source:
      - ${paths.cards}/samples.parquet

  pipeline:
    _target_: pipefunc.Pipeline
    validate_type_annotations: false
    functions:
      # samples are precomputed by `generate_cards`, so the pipeline is a plain read
      - _target_: pipefunc.PipeFunc
        output_name: samples
        func:
          _target_: hydra.utils.get_object
          path: polars.read_parquet
