#@yaml/text-templated-strings

#@ jobs = [
#@    'f70ee956-4941-4b44-ad85-89a3652692ab',
#@ ]
#@ frame_size = '256x144'
#@ cameras = ['cam_fork', 'cam_left_forward', 'cam_right_forward']

---
# Real D12 recordings: actuations from `data.mcap`, frames from pre-extracted
# JPEGs. The sample table is built by `rmind.scripts.prepare_d12`, which owns the
# clock alignment (see its docstring - the video timeline is nominal, so the
# mcap's own per-frame topic is the only real timebase).
#
# Frames come from `scripts/extract_d12_frames.sh` rather than the mp4s: shuffled
# access into h264 measured 1958ms per 6 frames against 1.6ms for pre-resized
# JPEGs, so decoding video here would leave the GPU idle. The JPEG filename is
# the encoded frame index, which is what `frame_idx` refers to. The resolution
# is part of the path, so several can coexist; keep `frame_size` in step with
# the experiment's `image_resize`.
#
# Every camera is its own stream with its own index column - they run on
# independent clocks and drop frames independently, so `prepare_d12` matches them
# to the reference timeline by timestamp rather than by index. Streams are
# declared for all cameras; which ones the MODEL consumes is set by `cameras` in
# the experiment, so limiting to one camera needs no change here.
_target_: rbyte.Dataset.from_config
_recursive_: false
_convert_: all
streams:
  #@ for/end camera in cameras:
  (@=camera@):
    index: (@=camera@)/frame_idx
    sources:
      #@ for/end job_id in jobs:
      (@=job_id@):
        _target_: rbyte.streams.path.PathSource
        path: "${paths.d12_frames}/(@=job_id@)/frames/(@=camera@)/(@=frame_size@)/{:09d}.jpg"
        decoder:
          _target_: simplejpeg.decode_jpeg
          _partial_: true
          colorspace: rgb
          fastdct: true
          fastupsample: true

samples:
  inputs:
    source:
      #@ for/end job_id in jobs:
      - ${paths.d12_samples}/(@=job_id@)/samples.parquet

  pipeline:
    _target_: pipefunc.Pipeline
    validate_type_annotations: false
    functions:
      - _target_: pipefunc.PipeFunc
        output_name: samples
        func:
          _target_: hydra.utils.get_object
          path: polars.read_parquet
