---
# Command cards (positive class) plus real recordings labelled (0, 0, 0)
# (negative class) - see `rmind.scripts.{generate_cards,prepare_background}`.
#
# Without the negatives the model has only ever seen cards, so an ordinary
# warehouse scene is out of distribution and its output is whatever the network
# extrapolates. With them, anything that is not a card commands a full stop.
#
# Both sources feed one stream: rbyte picks the source by each row's `input_id`,
# and `polars.read_parquet` concatenates the two sample tables (identical schemas).
_target_: rbyte.Dataset.from_config
_recursive_: false
_convert_: all
streams:
  cam_left_backward:
    index: frame_idx
    sources:
      cards:
        _target_: rbyte.streams.path.PathSource
        path: "${paths.cards}/frames/{:06d}.jpg"
        decoder:
          _target_: simplejpeg.decode_jpeg
          _partial_: true
          colorspace: rgb
          fastdct: true
          fastupsample: true

      background:
        _target_: rbyte.streams.path.PathSource
        path: "${paths.background}/frames/{:06d}.jpg"
        decoder:
          _target_: simplejpeg.decode_jpeg
          _partial_: true
          colorspace: rgb
          fastdct: true
          fastupsample: true

samples:
  inputs:
    source:
      - ${paths.cards}/samples.parquet
      - ${paths.background}/samples.parquet

  pipeline:
    _target_: pipefunc.Pipeline
    validate_type_annotations: false
    functions:
      # samples are precomputed by the two scripts, so the pipeline is a plain read
      - _target_: pipefunc.PipeFunc
        output_name: samples
        func:
          _target_: hydra.utils.get_object
          path: polars.read_parquet
